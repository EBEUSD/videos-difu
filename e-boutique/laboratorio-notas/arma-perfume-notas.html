<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Laboratorio de notas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Archivo variable (como etiquetas-menosde): ancho expandido (wdth 125) para títulos y rótulos, normal para el texto -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background: #0A0808
        }

        a {
            color: #F3ECE3
        }

        a:hover {
            color: #E8857A
        }

        /* Rótulos anchos (títulos, notas, perfumes) */
        .serif {
            font-stretch: 125%;
            font-variation-settings: "wdth" 125;
            font-weight: 700
        }

        @keyframes wave {
            to {
                transform: rotate(360deg)
            }
        }

        /* la nota cae por el cuello (queda detrás del vidrio) hasta el líquido */
        @keyframes fall {
            0% {
                top: -16%;
                transform: translateX(-50%) scale(.9) rotate(-20deg);
                opacity: 0
            }

            15% {
                opacity: 1
            }

            70% {
                top: 52%;
                transform: translateX(-50%) scale(.75) rotate(25deg);
                opacity: 1
            }

            100% {
                top: 66%;
                transform: translateX(-50%) scale(.35) rotate(40deg);
                opacity: 0
            }
        }

        @keyframes capFloat {

            0%,
            100% {
                transform: translateY(0) rotate(0)
            }

            50% {
                transform: translateY(-1.4%) rotate(1.5deg)
            }
        }

        @keyframes bubble {
            0% {
                transform: translateY(0) scale(.6);
                opacity: 0
            }

            20% {
                opacity: .8
            }

            100% {
                transform: translateY(-200px) scale(1);
                opacity: 0
            }
        }

        @keyframes shake {

            0%,
            100% {
                transform: rotate(0)
            }

            20% {
                transform: rotate(-6deg)
            }

            40% {
                transform: rotate(5deg)
            }

            60% {
                transform: rotate(-4deg)
            }

            80% {
                transform: rotate(3deg)
            }
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(24px)
            }
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: scale(.8) translateY(30px)
            }
        }

        @keyframes glow {

            0%,
            100% {
                opacity: .6
            }

            50% {
                opacity: 1
            }
        }

        @keyframes fill {
            from {
                width: 0
            }

            to {
                width: 100%
            }
        }

        .waveA {
            animation: wave 9s linear infinite
        }

        .waveB {
            animation: wave 13s linear infinite reverse
        }

        .fall {
            animation: fall 1.5s cubic-bezier(.4, .1, .6, 1) forwards
        }

        .bub {
            animation: bubble 3.2s ease-in infinite
        }

        /* espera a que cierre la tapa antes de agitar */
        .shake {
            animation: shake .5s ease-in-out .45s 3
        }

        .rise {
            animation: rise .7s cubic-bezier(.2, .8, .2, 1) both
        }

        .pop {
            animation: pop 1s cubic-bezier(.2, .8, .2, 1) both
        }

        .glow {
            animation: glow 4s ease-in-out infinite
        }

        /* Pantalla completa: el componente ocupa el alto de la ventana y nada scrollea la página */
        .ap {
            position: relative;
            height: 100vh;
            height: 100dvh;
            min-height: 560px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: clamp(16px, 2.6vh, 28px);
            box-sizing: border-box;
            padding: clamp(18px, 3.4vh, 40px) clamp(16px, 4.5vw, 72px);
            background: radial-gradient(ellipse 50% 60% at 70% 50%, #1E0909 0%, #0A0808 70%);
            color: #F3ECE3;
            font-family: 'Archivo', Arial, sans-serif
        }

        .ap-head {
            flex: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px
        }

        .ap-eyebrow {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 12px;
            letter-spacing: .42em;
            text-transform: uppercase;
            color: #E8857A
        }

        .ap-head-r {
            font-size: 12px;
            letter-spacing: .32em;
            text-transform: uppercase;
            color: #B9AFA6
        }

        .ap-body {
            flex: 1;
            min-height: 0;
            display: flex;
            gap: clamp(28px, 4vw, 72px)
        }

        .ap-h2 {
            margin: 0;
            line-height: 1;
            font-weight: 900;
            letter-spacing: -.02em
        }

        .ap-h2 em {
            color: #E8857A
        }

        .ap-lead {
            margin: 0;
            max-width: 560px;
            font-size: 16px;
            line-height: 1.65;
            color: #CFC6BD;
            font-weight: 300
        }

        .ap-label {
            font-size: 12px;
            letter-spacing: .3em;
            text-transform: uppercase;
            color: #B9AFA6
        }

        /* ---------- Intro ---------- */
        .ap-intro {
            align-items: center
        }

        .ap-intro-pyr {
            flex: 1 1 0;
            min-width: 0;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .ap-intro-txt {
            flex: 1.15 1 0;
            min-width: 0;
            max-height: 100%;
            overflow: auto;
            scrollbar-width: none;
            display: flex;
            flex-direction: column;
            gap: clamp(14px, 2.4vh, 24px)
        }

        /* Pirámide olfativa en 3 franjas (cada una es un tramo del mismo triángulo) */
        .ap-pyr {
            width: min(100%, 500px, 70dvh);
            aspect-ratio: 1 / .92;
            display: flex;
            flex-direction: column;
            gap: 6px
        }

        .ap-band {
            flex: 1;
            position: relative;
            cursor: pointer;
            border: none;
            padding: 0;
            overflow: hidden;
            background: #141010;
            font-family: inherit;
            color: #F3ECE3
        }

        .ap-band.b0 {
            clip-path: polygon(50% 0, 66.7% 100%, 33.3% 100%)
        }

        .ap-band.b1 {
            clip-path: polygon(33.3% 0, 66.7% 0, 83.3% 100%, 16.7% 100%)
        }

        .ap-band.b2 {
            clip-path: polygon(16.7% 0, 83.3% 0, 100% 100%, 0 100%)
        }

        .ap-band img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(.32) saturate(.5);
            transform: scale(1.04);
            transition: filter .8s ease, transform 1.2s cubic-bezier(.2, .8, .2, 1)
        }

        .ap-band.on img,
        .ap-band:hover img {
            filter: brightness(.95) saturate(1);
            transform: scale(1.12)
        }

        .ap-band .lbl {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 12px;
            text-align: center;
            font-size: 12px;
            letter-spacing: .26em;
            text-transform: uppercase;
            font-weight: 600;
            text-shadow: 0 1px 8px rgba(0, 0, 0, .9);
            opacity: .7;
            transition: opacity .4s ease
        }

        .ap-band.on .lbl {
            opacity: 1
        }

        .ap-tabs {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px
        }

        .ap-tab {
            cursor: pointer;
            font-family: inherit;
            background: transparent;
            border: none;
            padding: 0 0 4px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
            color: #B9AFA6;
            font-size: 13px;
            letter-spacing: .2em;
            text-transform: uppercase;
            transition: color .3s ease
        }

        .ap-tab:hover,
        .ap-tab.on {
            color: #F3ECE3
        }

        .ap-tab .bar {
            display: block;
            height: 2px;
            background: rgba(243, 236, 227, 0.15)
        }

        .ap-tab .bar span {
            display: block;
            height: 100%;
            width: 0;
            background: #E8857A
        }

        .ap-tab .bar .done {
            width: 100%
        }

        .ap-tab .bar .run {
            animation: fill 6s linear forwards
        }

        .ap-lay {
            display: flex;
            flex-direction: column;
            gap: clamp(10px, 1.8vh, 16px)
        }

        .ap-lay-title {
            font-size: clamp(26px, 2.4vw, 38px);
            line-height: 1.05
        }

        .ap-chip {
            font-size: 12px;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: #E8857A;
            border: 1px solid rgba(232, 133, 122, 0.5);
            padding: 7px 12px;
            white-space: nowrap
        }

        .ap-text {
            margin: 0;
            max-width: 600px;
            font-size: 17px;
            line-height: 1.6;
            color: #CFC6BD;
            font-weight: 300
        }

        .ap-fams {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center
        }

        .ap-ex {
            display: flex;
            gap: 16px;
            flex-wrap: wrap
        }

        .ap-ex span {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 80px;
            font-size: 13px;
            text-align: center;
            color: #CFC6BD;
            line-height: 1.3
        }

        .ap-ex img {
            width: clamp(48px, 7vh, 66px);
            height: clamp(48px, 7vh, 66px);
            border-radius: 50%;
            object-fit: cover;
            background: #050404;
            border: 1px solid rgba(243, 236, 227, 0.18)
        }

        .ap-timeline {
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        .ap-tl-row {
            display: flex;
            align-items: center;
            gap: 12px
        }

        .ap-tl-row>span:first-child {
            width: 84px;
            flex: none;
            font-size: 12px;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: #B9AFA6
        }

        .ap-tl-track {
            position: relative;
            flex: 1;
            height: 8px;
            background: rgba(243, 236, 227, 0.05)
        }

        .ap-tl-ticks {
            display: flex;
            justify-content: space-between;
            margin-left: 96px;
            font-size: 12px;
            color: #B9AFA6;
            letter-spacing: .08em
        }

        .ap-cta {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap
        }

        .ap-load {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 13px;
            color: #B9AFA6
        }

        .ap-load>span:last-child {
            width: 170px;
            height: 2px;
            background: rgba(243, 236, 227, 0.12)
        }

        /* ---------- Laboratorio (elegir / mezclar / resultado) ---------- */
        .ap-lab {
            align-items: stretch
        }

        .ap-main {
            flex: 1 1 0;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: clamp(12px, 2.2vh, 22px)
        }

        .ap-pick-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap
        }

        .ap-pick-head .ap-h2 {
            font-size: clamp(28px, 2.7vw, 42px)
        }

        .ap-link {
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            background: none;
            border: none;
            padding: 0;
            color: #E8857A;
            text-decoration: underline;
            text-underline-offset: 3px
        }

        .ap-steps {
            flex: none;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            border-bottom: 1px solid rgba(243, 236, 227, 0.12)
        }

        .ap-step {
            cursor: pointer;
            font-family: inherit;
            color: #B9AFA6;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            padding: 10px 8px 12px 0;
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
            min-width: 0;
            transition: color .3s ease, border-color .3s ease
        }

        .ap-step:hover,
        .ap-step:focus-visible {
            color: #F3ECE3;
            outline: none
        }

        .ap-step.on {
            color: #F3ECE3;
            border-bottom-color: #E8857A
        }

        .ap-step .thumb,
        .ap-bar .thumb {
            flex: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px dashed rgba(243, 236, 227, 0.3);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            letter-spacing: .08em;
            color: #B9AFA6;
            background: #050404
        }

        .ap-step.done .thumb,
        .ap-bar .thumb.done {
            border: 1px solid #E8857A
        }

        .ap-step .thumb {
            position: relative;
            overflow: visible
        }

        .ap-step .thumb img {
            border-radius: 50%
        }

        .ap-step .thumb .cnt {
            position: absolute;
            top: -4px;
            right: -6px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            font-size: 11px;
            letter-spacing: 0;
            color: #F3ECE3;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .ap-step .thumb img,
        .ap-bar .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        .ap-step .txt {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0
        }

        .ap-step .ttl {
            font-size: 13px;
            letter-spacing: .22em;
            text-transform: uppercase;
            font-weight: 500
        }

        .ap-step .sub {
            font-size: 15px;
            color: #B9AFA6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .ap-step.done .sub {
            color: #E8857A
        }

        .ap-hint-row {
            flex: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px 20px;
            flex-wrap: wrap
        }

        .ap-count {
            margin-left: 8px;
            font-size: 12px;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: #E8857A;
            white-space: nowrap
        }

        .ap-next {
            min-height: 42px
        }

        .ap-hint-row .ap-hint {
            flex: 1 1 260px;
            min-width: 0
        }

        /* solo para lectores de pantalla */
        .ap-sr {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap
        }

        .ap-step .dots {
            margin-left: 10px;
            letter-spacing: .18em;
            color: #E8857A
        }

        .ap-info {
            cursor: pointer;
            font-family: inherit;
            width: 22px;
            height: 22px;
            margin-left: 6px;
            padding: 0;
            border-radius: 50%;
            border: 1px solid rgba(243, 236, 227, 0.35);
            background: transparent;
            color: #CFC6BD;
            font-size: 12px;
            font-style: italic;
            font-weight: 600;
            vertical-align: 2px;
            transition: border-color .3s ease, color .3s ease
        }

        .ap-info:hover {
            border-color: #E8857A;
            color: #E8857A
        }

        .ap-wait {
            min-height: 54px;
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #B9AFA6
        }

        .ap-clear {
            font-size: 13px;
            color: #B9AFA6
        }

        .ap-hint {
            flex: none;
            margin: 0;
            font-size: 17px;
            line-height: 1.45;
            color: #CFC6BD;
            font-weight: 300
        }

        /* Notas: familias en filas, el tamaño de la tile sale del ancho (8 por fila) y del alto disponibles */
        .ap-notes {
            flex: 0 1 auto;
            min-height: 0;
            overflow: auto;
            scrollbar-width: thin;
            container-type: inline-size;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: clamp(12px, 2vh, 20px) 28px
        }

        .ap-group {
            display: flex;
            flex-direction: column;
            gap: 8px
        }

        .ap-fam {
            margin: 0;
            font-size: 12px;
            letter-spacing: .3em;
            text-transform: uppercase;
            color: #B9AFA6
        }

        .ap-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px
        }

        .ap-tile {
            --t: max(72px, min(calc((100cqw - 72px) / 8), calc((100dvh - 470px) / 2.6), 160px));
            position: relative;
            width: var(--t);
            aspect-ratio: 4 / 5;
            cursor: pointer;
            font-family: inherit;
            color: #F3ECE3;
            background: #050404;
            border: 1px solid rgba(243, 236, 227, 0.12);
            border-radius: 4px;
            padding: 0;
            overflow: hidden;
            transition: transform .4s cubic-bezier(.2, .8, .2, 1), border-color .3s ease
        }

        .ap-tile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform .6s cubic-bezier(.2, .8, .2, 1)
        }

        .ap-tile .nm {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 22px 8px 8px;
            font-size: 14px;
            font-stretch: 100%;
            font-variation-settings: "wdth" 100;
            line-height: 1.15;
            text-align: left;
            background: linear-gradient(180deg, rgba(5, 4, 4, 0), rgba(5, 4, 4, 0.92) 60%)
        }

        .ap-tile:hover,
        .ap-tile:focus-visible {
            transform: translateY(-3px);
            border-color: rgba(232, 133, 122, 0.7);
            outline: none
        }

        .ap-tile:hover img {
            transform: scale(1.08)
        }

        .ap-tile.on {
            border-color: #E8857A;
            box-shadow: 0 0 0 1px #E8857A
        }

        /* capa completa: el resto queda atenuado */
        .ap-tile.off {
            opacity: .35;
            cursor: default
        }

        .ap-tile.off:hover {
            transform: none;
            border-color: rgba(243, 236, 227, 0.12)
        }

        .ap-tile.off:hover img {
            transform: none
        }

        .ap-tile .chk {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #F3ECE3
        }

        /* ===== Perfil ===== */
        .ap-prof {
            display: flex;
            flex-direction: column;
            gap: clamp(14px, 2.6vh, 28px);
            min-height: 0;
            overflow: auto;
            scrollbar-width: thin
        }

        .ap-prof-top {
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        .ap-prof-h {
            font-size: clamp(32px, 3.6vw, 60px)
        }



        .ap-q {
            display: flex;
            flex-direction: column;
            gap: clamp(14px, 2.4vh, 24px)
        }

        /* progreso: "1 de 3" + segmentos (los ya respondidos permiten volver) */
        .ap-qhead {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap
        }

        .ap-qbar {
            display: flex;
            gap: 6px
        }

        .ap-qseg {
            width: 44px;
            height: 14px;
            padding: 0;
            border: none;
            cursor: pointer;
            background: linear-gradient(rgba(243, 236, 227, 0.18), rgba(243, 236, 227, 0.18)) center / 100% 3px no-repeat;
            transition: background-size .3s ease
        }

        .ap-qseg.done {
            background-image: linear-gradient(rgba(232, 133, 122, 0.55), rgba(232, 133, 122, 0.55))
        }

        .ap-qseg.on {
            background-image: linear-gradient(#E8857A, #E8857A)
        }

        .ap-qseg[aria-disabled="true"] {
            cursor: default
        }

        .ap-qseg.done:hover {
            background-size: 100% 5px
        }

        /* opciones de respuesta única: tarjetas con título y ayuda */
        .ap-choices {
            display: grid;
            gap: 10px
        }

        .ap-choices.c4 {
            grid-template-columns: repeat(4, minmax(0, 1fr))
        }

        .ap-choices.c3 {
            grid-template-columns: repeat(3, minmax(0, 1fr))
        }

        .ap-choice {
            cursor: pointer;
            font-family: inherit;
            color: #F3ECE3;
            text-align: left;
            background: #050404;
            border: 1px solid rgba(243, 236, 227, 0.14);
            border-radius: 4px;
            min-height: clamp(96px, 15vh, 140px);
            padding: 18px 18px 16px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 6px;
            transition: transform .4s cubic-bezier(.2, .8, .2, 1), border-color .3s ease, background-color .3s ease
        }

        .ap-choice .t {
            font-size: clamp(18px, 1.6vw, 24px);
            line-height: 1.1
        }

        .ap-choice .d {
            font-size: 14px;
            line-height: 1.35;
            color: #B9AFA6
        }

        .ap-choice:hover,
        .ap-choice:focus-visible {
            transform: translateY(-3px);
            border-color: rgba(232, 133, 122, 0.7);
            outline: none
        }

        .ap-choice.on {
            border-color: #E8857A;
            box-shadow: 0 0 0 1px #E8857A;
            background: rgba(232, 133, 122, 0.1)
        }

        .ap-styles {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 10px
        }

        .ap-style {
            position: relative;
            height: clamp(118px, 21vh, 210px);
            cursor: pointer;
            font-family: inherit;
            color: #F3ECE3;
            background: #050404;
            border: 1px solid rgba(243, 236, 227, 0.12);
            border-radius: 4px;
            padding: 0;
            overflow: hidden;
            text-align: left;
            transition: transform .4s cubic-bezier(.2, .8, .2, 1), border-color .3s ease
        }

        .ap-style .imgs img {
            position: absolute;
            width: 54%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            transition: transform .6s cubic-bezier(.2, .8, .2, 1), opacity .3s ease;
            opacity: .75
        }

        .ap-style .imgs img:nth-child(1) {
            left: -2%;
            top: 4%;
            transform: rotate(-12deg)
        }

        .ap-style .imgs img:nth-child(2) {
            right: -2%;
            top: 0;
            transform: rotate(10deg)
        }

        .ap-style .imgs img:nth-child(3) {
            left: 23%;
            top: 20%
        }

        .ap-style .nm {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 30px 10px 10px;
            font-size: 15px;
            font-stretch: 100%;
            font-variation-settings: "wdth" 100;
            line-height: 1.15;
            background: linear-gradient(180deg, rgba(5, 4, 4, 0), rgba(5, 4, 4, 0.94) 55%)
        }

        .ap-style .chk {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            background: #730101;
            color: #F3ECE3
        }

        .ap-style:hover,
        .ap-style:focus-visible {
            transform: translateY(-3px);
            border-color: rgba(232, 133, 122, 0.7);
            outline: none
        }

        .ap-style:hover .imgs img,
        .ap-style.on .imgs img {
            opacity: 1
        }

        .ap-style:hover .imgs img:nth-child(3) {
            transform: scale(1.08)
        }

        .ap-style.on {
            border-color: #E8857A;
            box-shadow: 0 0 0 1px #E8857A
        }

        .ap-style.on .chk {
            display: flex
        }

        .ap-prof-cta {
            display: flex;
            align-items: center;
            gap: 14px 22px;
            flex-wrap: wrap
        }

        .ap-live {
            font-size: 15px;
            color: #CFC6BD
        }

        .ap-live b {
            color: #F3ECE3;
            font-weight: 600
        }

        .ap-skip,
        .ap-prof-sum .ap-link {
            text-decoration: underline;
            text-underline-offset: 3px
        }

        .ap-prof-sum {
            flex: none;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 4px 12px;
            flex-wrap: wrap;
            font-size: 14px;
            color: #F3ECE3
        }

        .ap-more {
            flex: 1 1 100%;
            cursor: pointer;
            font-family: inherit;
            background: none;
            border: 1px dashed rgba(243, 236, 227, 0.25);
            color: #CFC6BD;
            min-height: 44px;
            font-size: 12px;
            letter-spacing: .2em;
            text-transform: uppercase;
            transition: border-color .25s ease, color .25s ease
        }

        .ap-more:hover,
        .ap-more:focus-visible {
            border-color: #E8857A;
            color: #E8857A;
            outline: none
        }

        /* ===== Ficha de la nota elegida ===== */
        .ap-note-info {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 4px 10px;
            animation: rise .5s cubic-bezier(.2, .8, .2, 1) both
        }

        .ap-note-info b {
            font-weight: 600;
            color: #F3ECE3
        }

        .ap-note-info .d::before {
            content: "· ";
            color: #8C837B
        }

        .ap-note-info .n {
            font-size: 13px;
            color: #E8857A
        }

        /* ===== Vista previa junto al frasco ===== */
        .ap-peek {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px 10px 10px;
            border: 1px solid rgba(243, 236, 227, 0.12);
            border-radius: 6px;
            background: rgba(5, 4, 4, 0.6);
            max-width: 100%;
            animation: rise .5s cubic-bezier(.2, .8, .2, 1) both
        }

        .ap-peek .txt {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0
        }

        .ap-peek .ap-label {
            font-size: 10px;
            color: #E8857A
        }

        .ap-peek .nm {
            font-size: 17px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .ap-peek .hs {
            font-size: 12px;
            color: #B9AFA6
        }

        .ap-bar-peek {
            display: block;
            margin-top: 2px;
            color: #E8857A;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .ap-bar-peek b {
            font-weight: 600
        }

        /* ===== Última mezcla ===== */
        .ap-last {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            max-width: 520px;
            padding: 10px 16px 10px 10px;
            cursor: pointer;
            font-family: inherit;
            color: #F3ECE3;
            text-align: left;
            background: transparent;
            border: 1px dashed rgba(243, 236, 227, 0.25);
            border-radius: 6px;
            transition: border-color .25s ease
        }

        .ap-last:hover,
        .ap-last:focus-visible {
            border-color: #E8857A;
            outline: none
        }

        .ap-last .txt {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
            font-size: 15px
        }

        .ap-last .txt b {
            font-weight: 600
        }

        .ap-last .go {
            margin-left: auto;
            font-size: 13px;
            color: #E8857A;
            white-space: nowrap
        }

        .ap-how {
            color: #8C837B
        }

        /* ===== Resultado: precio, por qué, acciones ===== */
        .ap-price {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 4px 10px;
            margin-top: 2px
        }

        .ap-price b {
            font-size: 22px;
            font-weight: 600;
            color: #F3ECE3
        }

        .ap-price s {
            font-size: 15px;
            color: #8C837B
        }

        .ap-price .sz {
            font-size: 13px;
            color: #B9AFA6
        }

        .ap-why {
            margin: 0;
            max-width: 62ch;
            font-size: 15px;
            line-height: 1.5;
            color: #CFC6BD;
            font-weight: 300
        }

        .ap-res-cta {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap
        }

        a.ap-ghost-a {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            min-height: 54px;
            box-sizing: border-box
        }

        .ap-res-acts {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 20px
        }

        .ap-act {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 36px;
            padding: 0;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            color: #CFC6BD;
            background: none;
            border: none;
            transition: color .25s ease
        }

        .ap-act svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .ap-act:hover,
        .ap-act:focus-visible {
            color: #E8857A;
            outline: none
        }

        .ap-alt-price {
            font-size: 13px;
            color: #F3ECE3
        }

        .ap-alt-price:empty {
            display: none
        }

        .ap-shared {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 16px;
            padding: 10px 14px;
            font-size: 14px;
            border: 1px solid rgba(232, 133, 122, 0.4);
            border-radius: 6px;
            background: rgba(115, 1, 1, 0.18)
        }

        .ap-shared .ap-link {
            color: #E8857A;
            font-size: 14px
        }

        /* Columna del matraz */
        .ap-side {
            position: relative;
            z-index: 2;
            transition: transform 1s cubic-bezier(.65, 0, .35, 1);
            flex: none;
            width: clamp(240px, 23vw, 360px);
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(14px, 2.4vh, 24px)
        }

        .ap-flask {
            position: relative;
            width: min(100%, calc((100dvh - 300px) / 1.5), 380px);
            aspect-ratio: 2 / 3;
            transform-origin: 50% 90%
        }

        /* capas decorativas: no capturan clics (el resplandor desborda el frasco y tapaba el botón de abajo) */
        .ap-flask .glow,
        .ap-liquid,
        .ap-orbit {
            pointer-events: none
        }

        .ap-liquid,
        .ap-glass,
        .ap-cap,
        .ap-cap img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%
        }

27% 36.72%, 79.39% 36.33%, 78.13% 35.94%, 75.88% 35.55%, 72.75% 35.16%, 70.61% 34.77%, 68.95% 34.38%, 67.68% 33.98%, 66.7% 33.59%, 65.72% 33.2%, 64.94% 32.81%, 64.26% 32.42%, 63.57% 32.03%, 62.99% 31.64%, 62.5% 31.25%, 62.01% 30.86%, 61.43% 30.47%)
        }

        /* volumen del líquido: bordes más oscuros y un brillo vertical, como visto a través del vidrio */
        .ap-liquid::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(90deg, rgba(0, 0, 0, .38), rgba(0, 0, 0, 0) 24%, rgba(255, 255, 255, .10) 40%, rgba(255, 255, 255, 0) 52%, rgba(0, 0, 0, 0) 74%, rgba(0, 0, 0, .42)),
                linear-gradient(180deg, rgba(255, 255, 255, 0) 55%, rgba(0, 0, 0, .25));
            pointer-events: none
        }

        .ap-glass {
            pointer-events: none;
            filter: drop-shadow(0 30px 40px rgba(0, 0, 0, 0.55))
        }

        .ap-flask .fall {
            position: absolute;
            left: 50%;
            width: 15%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 50%;
            pointer-events: none;
            animation: fall 1.5s cubic-bezier(.4, .1, .6, 1) forwards
        }

        /* tapa: levantada mientras se eligen notas, cerrada al mezclar */
        .ap-cap {
            pointer-events: none;
            transform-origin: 50% 12%;
            transition: transform .7s cubic-bezier(.2, .8, .2, 1)
        }

        .ap-cap.open {
            transform: translateY(-9%) rotate(-7deg)
        }

        .ap-cap.open img {
            animation: capFloat 4s ease-in-out infinite
        }

        .ap-slots {
            width: 100%;
            max-width: 330px;
            display: flex;
            flex-direction: column;
            gap: 8px
        }

        .ap-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center
        }

        /* ---------- Mezcla: el frasco viaja al centro y el resto se apaga ---------- */
        .ap-main {
            transition: opacity .5s ease
        }

        .ph-mixing .ap-main {
            opacity: 0;
            pointer-events: none
        }

        .ph-mixing .ap-side {
            transform: translateX(var(--dx, 0px)) scale(1.08)
        }

        /* anillo de ingredientes: el contenedor gira y cada foto contra-gira para quedar derecha */
        @keyframes orbit {
            to {
                transform: rotate(360deg)
            }
        }

        @keyframes orbIn {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(.3)
            }
        }

        .ap-orbit {
            position: absolute;
            /* centro a la altura del cuerpo del frasco; el borde inferior no baja del frasco */
            left: -8%;
            top: 14%;
            width: 116%;
            aspect-ratio: 1 / 1;
            z-index: 3;
            pointer-events: none;
            animation: orbit 9s linear infinite
        }

        .ap-orb {
            position: absolute;
            width: 20%;
            aspect-ratio: 1 / 1;
            transform: translate(-50%, -50%) scale(1);
            transition: left .7s cubic-bezier(.55, 0, .8, .3), top .7s cubic-bezier(.55, 0, .8, .3), transform .7s cubic-bezier(.55, 0, .8, .3), opacity .7s ease-in;
            animation: orbIn .5s cubic-bezier(.2, .8, .2, 1) backwards
        }

        .ap-orb img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #050404;
            border: 1px solid rgba(243, 236, 227, 0.35);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.6);
            transition: border-color .3s ease, box-shadow .3s ease;
            animation: orbit 9s linear infinite reverse
        }

        /* la nota que se está mezclando */
        .ap-orb.on {
            transform: translate(-50%, -50%) scale(1.3)
        }

        .ap-orb.on img {
            border-color: #E8857A;
            box-shadow: 0 0 0 3px rgba(232, 133, 122, 0.35), 0 0 32px rgba(232, 133, 122, 0.55)
        }

        /* absorbida: vuela al centro del frasco y se disuelve */
        .ap-orb.gone {
            left: 50% !important;
            top: 50% !important;
            transform: translate(-50%, -50%) scale(.15);
            opacity: 0
        }

        .ap-mixfx {
            width: min(560px, 90vw);
            min-height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            text-align: center
        }

        @keyframes tick {
            from {
                opacity: 0;
                transform: translateY(10px);
                filter: blur(6px)
            }
        }

        .ap-fx-main {
            font-size: clamp(26px, 2.6vw, 40px);
            line-height: 1.1;
            animation: tick .3s ease-out
        }

        .ap-fx-sub {
            min-height: 1.2em;
            font-size: 12px;
            letter-spacing: .3em;
            text-transform: uppercase;
            color: #B9AFA6
        }

        .ap-fx-bar {
            width: 220px;
            height: 2px;
            margin-top: 6px;
            background: rgba(243, 236, 227, 0.12)
        }

        .ap-fx-bar span {
            display: block;
            height: 100%;
            background: #E8857A
        }

        /* en la ruleta los nombres cambian rápido: entrada corta para que se lean */
        .ap-fx-main.spin {
            animation-duration: .12s
        }

        .ap-fx-skip {
            font-size: 12px;
            color: #B9AFA6
        }

        @keyframes swirl {

            0%,
            100% {
                transform: rotate(0) translateX(0)
            }

            25% {
                transform: rotate(-8deg) translateX(-3%)
            }

            75% {
                transform: rotate(8deg) translateX(3%)
            }
        }

        @keyframes wobble {

            0%,
            100% {
                transform: scale(1) rotate(0)
            }

            50% {
                transform: scale(1.03) rotate(1.5deg)
            }
        }

        @keyframes burst {
            0% {
                transform: scale(1)
            }

            35% {
                transform: scale(1.1)
            }

            100% {
                transform: scale(1)
            }
        }

        @keyframes flash {
            0% {
                opacity: .7;
                transform: scale(1)
            }

            40% {
                opacity: 1;
                transform: scale(1.45);
                filter: brightness(1.6)
            }

            100% {
                opacity: .85;
                transform: scale(1.1)
            }
        }

        .swirl {
            animation: swirl .6s ease-in-out infinite
        }

        .wobble {
            animation: wobble 1.1s ease-in-out infinite
        }

        .wobble .glow {
            animation: glow .8s ease-in-out infinite
        }

        .burst {
            animation: burst .8s cubic-bezier(.2, .8, .2, 1)
        }

        .burst .glow {
            animation: flash .9s ease-out forwards
        }

        .ap-mixing {
            flex: 1;
            display: flex;
            align-items: center;
            margin: 0;
            font-size: clamp(26px, 2.6vw, 40px);
            line-height: 1.25;
            color: #E8857A
        }

        /* Resultado */
        .ap-res {
            flex: 1;
            min-height: 0;
            overflow: auto;
            scrollbar-width: none;
            display: flex;
            flex-direction: column;
            /* safe: si el contenido crece (más recomendaciones) scrollea sin cortar arriba */
            justify-content: safe center;
            gap: clamp(12px, 2.4vh, 24px)
        }

        .ap-res-head {
            display: flex;
            align-items: center;
            gap: 24px
        }

        .ap-mono {
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: italic;
            color: #F3ECE3;
            border: 1px solid rgba(243, 236, 227, 0.25)
        }

        .ap-mono.lg {
            width: clamp(96px, 17vh, 160px);
            aspect-ratio: 1 / 1.3;
            font-size: clamp(34px, 6vh, 58px)
        }

        /* Foto del producto (vtexassets, fondo blanco): se presenta en una tarjeta clara */
        /* Foto del producto (JPG de VTEX con fondo blanco): con multiply el blanco toma el color
           del pedestal crema, así el frasco queda "apoyado" en luz y no recortado en un recuadro */
        .ap-shot {
            position: relative;
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            isolation: isolate;
            border-radius: 6px;
            background:
                radial-gradient(ellipse 70% 60% at 50% 40%, #FDFAF6 0%, #F3ECE3 55%, #DDCFBF 100%);
            box-shadow: 0 34px 50px -22px rgba(0, 0, 0, .85), inset 0 0 0 1px rgba(255, 255, 255, .35)
        }

        /* sombra de apoyo bajo el frasco */
        .ap-shot::after {
            content: "";
            position: absolute;
            left: 22%;
            right: 22%;
            bottom: 9%;
            height: 9%;
            border-radius: 50%;
            background: radial-gradient(closest-side, rgba(70, 50, 35, .28), rgba(70, 50, 35, 0));
            z-index: -1
        }

        .ap-shot img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            mix-blend-mode: multiply;
            /* las fotos traen mucho aire blanco alrededor del frasco */
            transform: scale(1.5)
        }

        .ap-shot.lg {
            width: clamp(140px, 23vh, 220px);
            aspect-ratio: 1 / 1.15
        }

        .ap-shot.sm {
            width: 64px;
            aspect-ratio: 1 / 1.15;
            border-radius: 4px
        }

        .ap-shot.sm::after,
        .ap-shot.xs::after {
            display: none
        }

        .ap-shot.xs {
            width: 44px;
            aspect-ratio: 1 / 1.15;
            border-radius: 4px
        }

        .ap-mono.sm {
            width: 54px;
            aspect-ratio: 1 / 1.3;
            font-size: 19px
        }

        .ap-res-name {
            font-size: clamp(36px, 3.6vw, 60px);
            line-height: 1
        }

        .ap-layer {
            display: flex;
            gap: 14px;
            align-items: baseline
        }

        .ap-layer>span:first-child {
            width: 90px;
            flex: none;
            font-size: 12px;
            letter-spacing: .26em;
            text-transform: uppercase;
            color: #B9AFA6
        }

        .ap-layer>span:last-child {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            flex: 1;
            min-width: 0
        }

        .ap-alts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 10px
        }

        /* fila de 3 recomendaciones extra: tarjetas más compactas */
        .ap-alts.ap-alts-more {
            grid-template-columns: repeat(3, minmax(0, 1fr))
        }

        .ap-alts-more .ap-alt {
            gap: 10px;
            padding: 10px
        }

        .ap-alts-more .ap-alt-name {
            font-size: 16px
        }

        @media (max-width: 899px) {

            /* en mobile: foto arriba y texto abajo para que entren 3 */
            .ap-alts-more .ap-alt {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px
            }

            .ap-alts-more .ap-alt-name {
                font-size: 14px
            }

            .ap-alts-more .ap-shot.sm {
                width: 100%;
                aspect-ratio: 1 / 1
            }
        }

        .btn {
            cursor: pointer;
            font-family: inherit;
            min-height: 54px;
            padding: 0 34px;
            border: none;
            font-size: 13px;
            letter-spacing: .24em;
            text-transform: uppercase;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: transform .3s ease, opacity .3s ease
        }

        .btn:hover {
            transform: translateY(-2px)
        }

        .btn[disabled] {
            cursor: default;
            opacity: .35;
            transform: none
        }

        .ghost {
            cursor: pointer;
            font-family: inherit;
            background: transparent;
            border: 1px solid rgba(243, 236, 227, 0.3);
            color: #F3ECE3;
            min-height: 48px;
            padding: 0 22px;
            font-size: 12px;
            letter-spacing: .2em;
            text-transform: uppercase
        }

        .ghost:hover {
            border-color: #E8857A;
            color: #E8857A
        }

        .pill {
            display: inline-block;
            padding: 6px 11px;
            border: 1px solid rgba(243, 236, 227, 0.18);
            font-size: 14px;
            color: #CFC6BD
        }

        .pill.hit {
            border-color: #E8857A;
            color: #E8857A
        }

        .ap-alt {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px;
            border: 1px solid rgba(243, 236, 227, 0.12);
            text-decoration: none;
            transition: border-color .3s ease
        }

        .ap-alt:hover,
        .ap-alt:focus-visible {
            border-color: #E8857A;
            outline: none
        }

        /* las alternativas son botones: se ven como tarjetas */
        button.ap-alt {
            position: relative;
            width: 100%;
            cursor: pointer;
            font-family: inherit;
            color: #F3ECE3;
            text-align: left;
            background: transparent
        }

        .ap-alt-name {
            font-size: 19px;
            transition: color .25s ease
        }

        .ap-alt:hover .ap-alt-name {
            color: #E8857A
        }

        .ap-alt-go {
            margin-left: auto;
            padding-left: 8px;
            font-size: 18px;
            color: #8C837B;
            transition: transform .3s ease, color .3s ease
        }

        .ap-alt:hover .ap-alt-go {
            transform: translateX(4px);
            color: #E8857A
        }

        .ap-alt-tag {
            position: absolute;
            top: -9px;
            right: 12px;
            padding: 2px 8px;
            font-size: 10px;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: #F3ECE3;
            background: #730101
        }

        /* Barra inferior (solo mobile) con el progreso */
        .ap-bar {
            display: none
        }

        /* Desktop con poca altura: se resigna lo accesorio */
        @media (min-width: 900px) and (max-height: 820px) {
            .ap-timeline {
                display: none
            }
        }

        @media (min-width: 900px) and (max-height: 680px) {

            .ap-lead,
            .ap-fams {
                display: none
            }
        }

        @media (max-width: 899px) {
            .ap-head-r {
                display: none
            }

            .ap-intro {
                flex-direction: column;
                align-items: stretch;
                gap: 16px;
                overflow: auto;
                scrollbar-width: none
            }

            .ap-intro-pyr {
                flex: none;
                height: auto
            }

            .ap-pyr {
                width: min(56%, 21dvh)
            }

            .ap-intro .ap-h2 {
                font-size: clamp(26px, 7.6vw, 34px) !important
            }

            .ap-lay-title {
                font-size: 24px
            }

            .ap-ex {
                gap: 8px;
                flex-wrap: nowrap
            }

            .ap-ex span {
                width: 25%;
                font-size: 12px
            }

            /* el botón de empezar siempre a la vista */
            .ap-cta {
                position: sticky;
                bottom: 0;
                padding: 12px 0 2px;
                background: linear-gradient(180deg, rgba(10, 8, 8, 0), #0A0808 30%)
            }

            .ap-band .lbl .nm {
                display: none
            }

            .ap-intro-txt {
                flex: none;
                max-height: none;
                overflow: visible;
                gap: 16px
            }

            .ap-lead,
            .ap-timeline,
            .ap-fams {
                display: none
            }

            .ap-text {
                font-size: 16px
            }

            /* 3 arriba y 2 más anchas abajo, sin huecos */
            .ap-styles {
                grid-template-columns: repeat(6, minmax(0, 1fr));
                gap: 8px
            }

            .ap-style {
                grid-column: span 2
            }

            .ap-style:nth-child(n+4) {
                grid-column: span 3
            }

            .ap-style:nth-child(n+4) .imgs img {
                width: 40%
            }

            .ap-style:nth-child(n+4) .imgs img:nth-child(3) {
                left: 30%
            }

            .ap-style {
                height: clamp(96px, 15dvh, 140px)
            }

            .ap-style .nm {
                font-size: 12px;
                padding: 24px 7px 7px
            }

            .ap-choices.c4 {
                grid-template-columns: repeat(2, minmax(0, 1fr))
            }

            .ap-choices.c3 {
                grid-template-columns: 1fr
            }

            .ap-choice {
                min-height: 0;
                padding: 16px
            }

            .ap-choices.c4 .ap-choice {
                min-height: 104px
            }

            .ap-prof-h {
                font-size: clamp(28px, 8vw, 40px)
            }

            .ap-qseg {
                width: 32px
            }

            /* la acción del perfil queda siempre a mano */
            .ap-prof-cta {
                position: sticky;
                bottom: 0;
                padding: 18px 0 4px;
                background: linear-gradient(180deg, rgba(10, 8, 8, 0), #0A0808 30%)
            }

            .ap-prof-cta .btn {
                flex: 1 1 100%;
                justify-content: center
            }

            .ap-prof-cta .ghost {
                padding: 0 14px
            }

            .ap-intro .btn {
                width: 100%;
                justify-content: center
            }

            .ap-lab {
                flex-direction: column
            }

            .ph-profile .ap-side,
            .ph-pick .ap-side,
            .ph-result .ap-side,
            .ph-mixing .ap-main {
                display: none
            }

            .ap-side {
                width: 100%;
                flex: 1
            }

            .ap-flask {
                width: min(64vw, calc((100dvh - 360px) / 1.5))
            }

            .ap-step {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px
            }

            .ap-step .sub,
            .ap-step .dots {
                display: none
            }

            .ap-pick-head {
                flex-direction: column;
                gap: 6px
            }

            .ap-pick-head .ap-h2 {
                font-size: clamp(22px, 6.6vw, 30px);
                white-space: nowrap
            }

            .ap-hint {
                font-size: 15px
            }

            /* en mobile "Siguiente" vive en la barra inferior */
            .ap-main .ap-next {
                display: none
            }

            .ap-tile {
                aspect-ratio: 1 / 1
            }

            .ap-res .btn {
                flex: 1 1 100%;
                justify-content: center
            }

            .ap-res-cta .ap-ghost-a {
                flex: 1 1 100%;
                justify-content: center;
                min-height: 48px
            }

            .ap-why {
                font-size: 14px
            }

            .ap-last .go {
                display: none
            }

            .ap-res .ghost {
                flex: 1 1 0;
                padding: 0 10px
            }

            .ap-notes {
                gap: 14px
            }

            .ap-tile {
                --t: calc((100cqw - 31px) / 4)
            }

            .ap-tile .nm {
                font-size: 11px;
                padding: 18px 6px 6px
            }

            .ap-main {
                justify-content: flex-start
            }

            .ap-res-head {
                gap: 16px
            }

            .ap-mono.lg {
                width: 84px;
                font-size: 30px
            }

            .ap-shot.lg {
                width: 108px
            }

            .ap-res-name {
                font-size: 32px
            }

            .ap-layer>span:first-child {
                width: 72px;
                font-size: 11px
            }

            .pill {
                font-size: 13px;
                padding: 5px 9px
            }

            .ap-bar {
                display: flex;
                flex: none;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                margin: 0 calc(-1 * clamp(16px, 4.5vw, 72px)) calc(-1 * clamp(18px, 3.4vh, 40px));
                padding: 12px clamp(16px, 4.5vw, 72px);
                background: rgba(10, 8, 8, 0.94);
                border-top: 1px solid rgba(243, 236, 227, 0.12)
            }

            .ap-bar .thumb {
                width: 30px;
                height: 30px;
                font-size: 11px
            }

            .ap-bar .btn {
                min-height: 46px;
                padding: 0 18px
            }
        }

        /* Mobile bajo: se resigna lo accesorio */
        @media (max-width: 899px) and (max-height: 760px) {
            .ap-ex,
            .ap-hint,
            .ap-alts-block {
                display: none
            }

            .ap-pyr {
                width: min(46%, 18dvh)
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .waveA,
            .waveB,
            .fall,
            .bub,
            .shake,
            .rise,
            .pop,
            .glow,
            .swirl,
            .wobble,
            .burst,
            .wobble .glow,
            .burst .glow,
            .ap-fx-main,
            .ap-orbit,
            .ap-orb,
            .ap-orb img,
            .ap-cap.open img,
            .ap-tab .bar .run {
                animation: none
            }

            .ap-tab .bar .run {
                width: 100%
            }

            .fall {
                opacity: 0
            }
        }

                    showIntro: function () {
                        clearTimeout(self.adv);
                        self.setState({ phase: 'intro', intro: 0 });
                        self.play();
                    },
                    picking: phase === 'pick', mixing: phase === 'mixing', showResult: phase === 'result',
                    steps: steps, groups: groups, stepKey: 'apStep-' + STEPS[cur].k, stepHint: STEPS[cur].hint,
                    canNext: canNext, waitPick: !full && !canNext, max: String(MAX), curLabel: STEPS[cur].label.toLowerCase(),
                    barNext: canNext, barDisabled: !full && !canNext, nextText: nxStep ? 'Siguiente: ' + nxStep.label : '',
                    next: function () { clearTimeout(self.adv); if (nxIdx >= 0) self.setState({ step: nxIdx }); },
                    drops: allPicks.map(function (k) { return { id: 'apDrop-' + k, img: byK[k].img }; }),
                    waveA: wave(0.9, 0), waveB: wave(0.5, -2),
                    bottle: BOTTLE,
                    capCls: 'ap-cap' + (phase === 'pick' ? ' open' : ''),
                    hasLiquid: total > 0, hasAny: total > 0,
                    glowStyle: 'position: absolute; left: -18%; bottom: -12%; width: 135%; aspect-ratio: 1 / 1; border-radius: 50%; background: radial-gradient(circle, ' + rgb.replace('rgb', 'rgba').replace(')', ',0.45)') + ' 0%, rgba(10,8,8,0) 65%); transition: background 1.2s ease',
                    flaskClass: mixing ? ['', 'swirl', 'wobble', 'burst'][ms] : '',
                    fx: fx, orbs: mixing ? orbs : [], notMixing: !mixing, dx: mixing ? (st.dx || 0) : 0,
                    slots: STEPS.map(function (s, i) {
                        var p = picks[s.k].length > 0;
                        var active = phase === 'pick' && i === cur;
                        return {
                            layer: s.label, label: p ? names(picks[s.k]) : '·', go: goStep(i),
                            style: 'cursor: pointer; font-family: inherit; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 14px; background: ' + (active ? 'rgba(232,133,122,0.08)' : 'transparent') + '; color: ' + (p ? '#F3ECE3' : '#B9AFA6') + '; border: 1px ' + (p ? 'solid #E8857A' : 'dashed rgba(243,236,227,0.25)') + '; text-align: left'
                        };
                    }),
                    full: full, notFull: !full,
                    barText: full ? total + ' notas · lista para mezclar' : 'Falta ' + missing.map(function (s) { return s.label; }).join(' y '),
                    mixText: total > 4 ? 'tus ' + total + ' notas' : allPicks.map(function (k) { return byK[k].label.toLowerCase(); }).join(', '),
                    // ~6s: al centro (0.9) · notas (2.2) · ruleta que frena (2.1) · revelación (0.9)
                    mix: function () {
                        if (!full) return;
                        AP.track('mezclar', { notas: allPicks.join(','), cantidad: total });
                        clearTimeout(self.adv); self.clearMix();
                        // cuánto tiene que viajar el frasco para quedar al centro (solo desktop)
                        var dx = 0, lab = document.querySelector('#apTop .ap-lab'), side = document.getElementById('apFlask');
                        if (lab && side && side.offsetWidth && window.matchMedia('(min-width: 900px)').matches) {
                            var a = lab.getBoundingClientRect(), b = side.getBoundingClientRect();
                            dx = Math.round(a.left + a.width / 2 - (b.left + b.width / 2));
                        }
                        self.setState({ focus: null, moreRecs: false, phase: 'mixing', mixStage: 0, mixTick: 0, shuffle: 0, shuffleN: 0, dx: dx, mixRun: (self.state.mixRun || 0) + 1, seed: P.map(Math.random) });
                        var T = function (ms, fn) { self.mt.push(setTimeout(fn, ms)); };
                        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                            T(1200, function () { self.setState({ phase: 'result' }); });
                            return;
                        }
                        T(900, function () {
                            self.setState({ mixStage: 1 });
                            self.mi = setInterval(function () { self.setState({ mixTick: self.state.mixTick + 1 }); }, Math.max(200, Math.floor(2200 / (total + 0.5))));
                        });
                        var t = 3100, delays = [80, 85, 90, 100, 110, 125, 145, 170, 205, 250, 310, 390];
                        T(t, function () { clearInterval(self.mi); self.setState({ mixStage: 2, shuffle: 1 + Math.floor(Math.random() * 6) }); });
                        // la ruleta se va frenando y el último giro cae en el ganador (índice 0)
                        delays.forEach(function (d, i) {
                            t += d;
                            T(t, function () {
                                var last = i === delays.length - 1;
                                self.setState({ shuffleN: self.state.shuffleN + 1, shuffle: last ? 0 : 1 + Math.floor(Math.random() * 6) });
                            });
                        });
                        T(t + 450, function () { self.setState({ mixStage: 3 }); });
                        T(t + 1350, function () { self.setState({ phase: 'result' }); });
                    },
                    skip: function () { self.clearMix(); self.setState({ phase: 'result' }); },
                    edit: function () { self.setState({ phase: 'pick', shared: false }); },
                    // vaciar: borra las notas elegidas y sigue en la misma pantalla
                    clear: function () {
                        clearTimeout(self.adv);
                        self.setState({ picks: { top: [], heart: [], base: [] }, step: 0 });
                    },
                    reset: function () {
                        clearTimeout(self.t); clearTimeout(self.adv); self.clearMix();
                        clearTimeout(self.pqT);
                        // nueva mezcla: arranca de nuevo por el perfil (puede ser para otra persona)
                        AP.track('nueva_mezcla');
                        self.setState({ shared: false, lastMix: AP.loadLast(),  picks: { top: [], heart: [], base: [] }, step: 0, phase: 'profile', pq: 0, prof: { g: '', s: [], w: '' }, focus: null, allNotes: false });
                    },
                    res: res, alts: alts.slice(0, 2), hasAlts: alts.length > 0,
                    // vista previa y ficha de nota
                    peek: peek || {}, hasPeek: !!peek,
                    noteInfo: picks[STEPS[cur].k].indexOf(st.lastNote) >= 0 ? noteInfoOf(st.lastNote) : null,
                    noNoteInfo: picks[STEPS[cur].k].indexOf(st.lastNote) < 0,
                    shared: !!st.shared && phase === 'result',
                    // última mezcla guardada
                    hasLast: !!(st.lastMix && st.lastMix.name) && phase === 'profile' && pq === 0 && !total,
                    last: st.lastMix || {},
                    resume: function () {
                        var lm = self.state.lastMix;
                        if (!lm || !lm.picks) return;
                        AP.track('retomar_mezcla', { perfume: lm.house + ' ' + lm.name });
                        self.setState({ picks: lm.picks, prof: lm.prof || { g: '', s: [], w: '' }, phase: 'result', focus: null, moreRecs: false, shared: false });
                    },
                    // compartir
                    shareText: st.shareMsg || 'Compartir mi mezcla',
                    cardText: st.cardMsg || 'Guardar tarjeta',
                    share: function () {
                        if (!best) return;
                        var url = AP.withParams(AP.pageUrl(), { mezcla: mixKey, perfil: hasProf ? (prof.g || '') + '-' + prof.s.join('.') + '-' + (prof.w || '') : '' });
                        var text = 'Armé mi perfume en el Laboratorio de notas de Rouge con ' + AP.list(allPicks.map(function (k) { return byK[k].label.toLowerCase(); })) + ' y se parece a ' + best.p.name + ' de ' + best.p.house + '. Armá el tuyo:';
                        var copy = function () {
                            AP.copy(text + ' ' + url).then(function (ok) {
                                AP.track('compartir', { metodo: 'copiar' });
                                self.setState({ shareMsg: ok ? '¡Link copiado!' : 'No se pudo copiar' });
                                clearTimeout(self.sm); self.sm = setTimeout(function () { self.setState({ shareMsg: '' }); }, 2400);
                            });
                        };
                        if (navigator.share && window.matchMedia('(pointer: coarse)').matches) {
                            navigator.share({ title: 'Mi mezcla · Rouge', text: text, url: url }).then(function () { AP.track('compartir', { metodo: 'nativo' }); }, function (e) { if (!e || e.name !== 'AbortError') copy(); });
                        } else copy();
                    },
                    saveCard: function () {
                        if (!best || self.state.cardMsg === 'Generando…') return;
                        self.setState({ cardMsg: 'Generando…' });
                        var c3 = col.map(Math.round).join(',');
                        AP.card({
                            layers: STEPS.map(function (s) { return { label: s.label, notes: picks[s.k].map(function (k) { return { label: byK[k].label, img: byK[k].img }; }) }; }),
                            name: best.p.name, house: best.p.house, img: best.p.img, match: matchText(best.m),
                            rgba: function (a) { return 'rgba(' + c3 + ',' + a + ')'; }
                        }).then(function (cv) {
                            return AP.exportCard(cv, 'mi-mezcla-rouge.png', 'Mi mezcla · Rouge');
                        }).then(function (how) {
                            AP.track('tarjeta', { metodo: how });
                            self.setState({ cardMsg: how === 'descarga' ? '¡Imagen descargada!' : '' });
                        }, function () {
                            self.setState({ cardMsg: 'No se pudo generar' });
                        }).then(function () {
                            clearTimeout(self.cm); self.cm = setTimeout(function () { self.setState({ cardMsg: '' }); }, 2600);
                        });
                    },
                    moreAlts: alts.slice(2, 5), showMore: !!st.moreRecs && alts.length > 2, canMore: !st.moreRecs && alts.length > 2,
                    moreRecs: function () { AP.track('ver_mas_recomendaciones'); self.setState({ moreRecs: true }); },
                };
            }
        }

        var tpl = document.createElement('template'); tpl.innerHTML = TPL;
        var app = document.getElementById('app');
        // imgBase / frascoBase: carpeta de las imágenes. Al subirlas a VTEX (Archivos) cambiar ambas por
        // "https://www.perfumeriasrouge.com/arquivos/" (VTEX no usa subcarpetas, quedan todas juntas).
        mountDC(Component, { "accent": "#730101", "imgBase": "imagenes/notas/", "frascoBase": "imagenes/frasco/" }, tpl, app);

        // Links fuera del iframe de VTEX
        app.addEventListener('click', function (e) {
            var a = e.target.closest && e.target.closest('a[href]');
            if (!a) return;
            e.preventDefault();
            if (a.getAttribute('data-track')) AP.track(a.getAttribute('data-track'), { perfume: a.getAttribute('data-name') || '' });
            try { window.top.location.href = a.href; } catch (err) { window.location.href = a.href; }
        });
    </script>
</body>

</html>
