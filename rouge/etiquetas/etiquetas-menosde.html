<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Archivo variable: ancho expandido (wdth 125) para títulos y rótulos, normal para los precios -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
    <style>
        html,
        body {
            margin: 0 !important;
            padding: 0 !important;
            background: transparent
        }

        * {
            box-sizing: border-box
        }

        /* Estética KV Cyber Week: rojo pleno con rayado diagonal, blanco y negro */
        .rgt {
            --red: #E30613;
            --ink: #111;
            background:
                repeating-linear-gradient(135deg, rgba(0, 0, 0, .06) 0 2px, rgba(0, 0, 0, 0) 2px 22px),
                var(--red);
            color: #fff;
            font-family: 'Archivo', Arial, sans-serif;
            padding: 30px 0 34px;
            overflow: hidden
        }

        /* Rótulos anchos (título, N°, HASTA, botón) */
        .rgt-wide {
            font-stretch: 125%;
            font-variation-settings: "wdth" 125
        }

        .rgt-in {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 72px
        }

        .rgt-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 4px
        }

        .rgt-title {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 16px;
            margin: 0;
            font-size: 28px;
            font-weight: 900;
            line-height: 1;
            text-transform: uppercase;
            color: #fff
        }

        /* Corte de línea solo en mobile */
        .rgt-mbr {
            display: none
        }

        .rgt-title mark {
            padding: 6px 14px 5px;
            background: var(--ink);
            color: #fff
        }

        /* Sello "CYBER WEEK" inclinado */
        .rgt-stamp {
            flex-shrink: 0;
            padding: 8px 16px 7px;
            background: var(--ink);
            transform: rotate(-4deg);
            font-size: 18px;
            font-weight: 900;
            line-height: 1;
            text-transform: uppercase;
            white-space: nowrap
        }

        .rgt-stamp b {
            color: var(--red)
        }

        /* Cartel: CYBER y WEEK intercambian blanco/rojo y el sello tambalea en cada cambio */
        .rgt-stamp {
            animation: rgtWobble 2.4s ease-in-out infinite
        }

        .rgt-stamp span {
            animation: rgtSwapA 2.4s steps(1, end) infinite
        }

        .rgt-stamp b {
            animation: rgtSwapB 2.4s steps(1, end) infinite
        }

        @keyframes rgtSwapA {
            0% {
                color: #fff
            }

            50% {
                color: var(--red)
            }
        }

        @keyframes rgtSwapB {
            0% {
                color: var(--red)
            }

            50% {
                color: #fff
            }
        }

        /* rotate (no transform) para sumarse a la inclinación del sello: tambalea después de cada cambio */
        @keyframes rgtWobble {

            0%,
            15%,
            50%,
            65%,
            100% {
                rotate: 0deg
            }

            3%,
            53% {
                rotate: 2deg
            }

            7%,
            57% {
                rotate: -1.5deg
            }

            11%,
            61% {
                rotate: .8deg
            }
        }

        .rgt-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 36px
        }

        .rgt-tag {
            --r: 0deg;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: inherit;
            transform-origin: 50% 0;
            transform: rotate(var(--r));
            transition: transform .6s cubic-bezier(.34, 1.56, .64, 1);
            /* Sombra en el contenedor: el clip-path de la etiqueta recortaría un box-shadow */
            filter: drop-shadow(0 14px 18px rgba(80, 0, 0, .35));
            -webkit-tap-highlight-color: transparent
        }

        .rgt-tag:nth-child(1) {
            --r: -2deg
        }

        .rgt-tag:nth-child(2) {
            --r: 1.5deg
        }

        .rgt-tag:nth-child(3) {
            --r: -1deg
        }

        .rgt-tag:nth-child(4) {
            --r: 2deg
        }

        .rgt-tag:focus-visible {
            outline: 3px solid #fff;
            outline-offset: 6px
        }

        /* Hilo recto */
        .rgt-string {
            display: block;
            width: 1.5px;
            height: 40px;
            background: rgba(255, 255, 255, .75)
        }

        .rgt-paper {
            width: 100%;
            height: 226px;
            padding: 16px 18px 18px;
            background: #fff;
            color: var(--ink);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 9px;
            text-align: center;
            clip-path: polygon(20px 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 0 100%, 0 20px)
        }

        .rgt-hole {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--red);
            border: 3px solid var(--ink);
            flex-shrink: 0
        }

        .rgt-num,
        .rgt-hasta {
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .22em;
            line-height: 1;
            text-transform: uppercase
        }

        .rgt-line {
            width: 100%;
            border-top: 2px dashed #CFCFCF
        }

        .rgt-hasta {
            margin-top: 2px;
            font-size: 14px;
            letter-spacing: .3em
        }

        .rgt-price {
            font-size: 46px;
            font-weight: 900;
            line-height: .95;
            letter-spacing: -.02em;
            white-space: nowrap
        }

        .rgt-cta {
            width: 100%;
            margin-top: auto;
            padding: 12px 10px 11px;
            background: var(--ink);
            color: #fff;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: .24em;
            line-height: 1;
            text-transform: uppercase;
            transition: background .3s ease, color .3s ease
        }

        /* N° 04 – edición lujo: etiqueta negra, rótulo rojo, botón rojo */
        .rgt-tag.is-lux .rgt-paper {
            background: var(--ink);
            color: #fff
        }

        .rgt-tag.is-lux .rgt-hole {
            background: transparent;
            border-color: var(--red)
        }

        .rgt-tag.is-lux .rgt-num {
            color: var(--red)
        }

        .rgt-tag.is-lux .rgt-line {
            border-top-color: #555
        }

        .rgt-tag.is-lux .rgt-cta {
            background: var(--red)
        }

        @media (hover:hover) {
            .rgt-tag:hover {
                transform: rotate(0deg) translateY(6px)
            }

            .rgt-tag:hover .rgt-cta {
                background: var(--red)
            }

            .rgt-tag.is-lux:hover .rgt-cta {
                background: #fff;
                color: var(--ink)
            }
        }

        /* Tablet */
        @media (max-width:1100px) {
            .rgt-in {
                padding: 0 40px
            }

            .rgt-title {
                font-size: 22px
            }

            .rgt-price {
                font-size: 38px
            }
        }

        @media (max-width:1024px) {
            .rgt-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 24px 40px
            }

            .rgt-price {
                font-size: 46px
            }
        }

        /* Mobile: grilla 2x2, título grande en dos bloques y etiquetas más altas */
        @media (max-width:640px) {
            .rgt {
                padding: 20px 0 30px
            }

            .rgt-in {
                padding: 0 16px
            }

            /* El sello pasa arriba del título */
            .rgt-head {
                flex-direction: column-reverse;
                align-items: stretch;
                gap: 18px;
                margin-bottom: 14px
            }

            .rgt-title {
                display: block;
                font-size: clamp(24px, 7.4vw, 32px);
                line-height: 1.05
            }

            .rgt-title span {
                display: block
            }

            .rgt-mbr {
                display: inline
            }

            .rgt-title mark {
                display: block;
                margin-top: 16px;
                padding: 12px 22px 11px
            }

            .rgt-stamp {
                align-self: flex-start;
                padding: 8px 12px 7px;
                font-size: 16px;
                transform: rotate(-3deg)
            }

            .rgt-grid {
                gap: 22px 12px
            }

            /* Menos inclinación: en columnas angostas las esquinas giradas se enciman */
            .rgt-tag:nth-child(1) {
                --r: -2deg
            }

            .rgt-tag:nth-child(2) {
                --r: 1.5deg
            }

            .rgt-tag:nth-child(3) {
                --r: -1deg
            }

            .rgt-tag:nth-child(4) {
                --r: 1.5deg
            }

            .rgt-string {
                height: 44px
            }

            .rgt-paper {
                height: 260px;
                padding: 18px 12px 14px;
                gap: 9px;
                clip-path: polygon(16px 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%, 0 16px)
            }

            .rgt-hole {
                width: 14px;
                height: 14px
            }

            .rgt-num {
                font-size: 10px;
                letter-spacing: .18em
            }

            /* En mobile la 04 dice "N° 04 · LUJO" */
            .rgt-luxlong {
                display: none
            }

            .rgt-hasta {
                font-size: 12px;
                letter-spacing: .3em
            }

            .rgt-price {
                font-size: clamp(22px, 7.4vw, 32px)
            }

            /* El botón va pegado al precio; la etiqueta deja aire abajo, como cartón colgado */
            .rgt-cta {
                margin-top: 6px;
                padding: 13px 4px 12px;
                font-size: 11px;
                letter-spacing: .14em
            }
        }

        @media (prefers-reduced-motion:reduce) {

            .rgt-tag {
                transition: none
            }

            .rgt-stamp,
            .rgt-stamp span,
            .rgt-stamp b {
                animation: none
            }
        }
    </style>
</head>

                    <span class="rgt-string" aria-hidden="true"></span>

            </div>

        </div>
    </section>
