<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Clarins | Categorías</title>
    <style>
        @font-face {
            font-family: 'BasisGrotesque';
            font-weight: 400;
            font-style: normal;
            font-display: swap;
            src: url('https://ebeusd.github.io/videos-difu/servicios-difu/fonts/BasisGrotesqueArabicPro-Regular.woff2') format('woff2'),
                url('https://ebeusd.github.io/videos-difu/servicios-difu/fonts/BasisGrotesqueArabicPro-Regular.woff') format('woff'),
                url('https://ebeusd.github.io/videos-difu/servicios-difu/fonts/BasisGrotesqueArabicPro-Regular.ttf') format('truetype');
        }

        @font-face {
            font-family: 'BasisGrotesque';
            font-weight: 500;
            font-style: normal;
            font-display: swap;
            src: url('https://ebeusd.github.io/videos-difu/servicios-difu/fonts/BasisGrotesqueArabicPro-Medium.woff2') format('woff2'),
                url('https://ebeusd.github.io/videos-difu/servicios-difu/fonts/BasisGrotesqueArabicPro-Medium.woff') format('woff'),
                url('https://ebeusd.github.io/videos-difu/servicios-difu/fonts/BasisGrotesqueArabicPro-Medium.ttf') format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'BasisGrotesque', 'Helvetica Neue', Arial, sans-serif;
            color: #111;
            background: #fff;
        }

        .cc {
            max-width: 1240px;
            margin: 0 auto;
            padding: 28px 20px;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 24px;
        }

        .cc-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            color: inherit;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }

        .cc-media {
            position: relative;
            display: block;
            width: 100%;
            overflow: hidden;
            transition: box-shadow 0.6s ease;
        }

        .cc-media img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            transition: transform 1.1s cubic-bezier(0.2, 0.7, 0.2, 1);
        }

        .cc-media::after {
            content: "";
            position: absolute;
            top: 14px;
            right: 14px;
            bottom: 14px;
            left: 14px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.08);
            opacity: 0;
            transform: scale(1.05);
            transition: opacity 0.5s ease, transform 0.7s cubic-bezier(0.2, 0.7, 0.2, 1);
            pointer-events: none;
        }

        .cc-title {
            position: relative;
            padding-bottom: 8px;
            font-size: 17px;
            font-weight: 500;
            letter-spacing: 0.02em;
            text-align: center;
        }

        .cc-title::after {
            content: "";
            position: absolute;
            left: 20%;
            right: 20%;
            bottom: 0;
            height: 1px;
            background: #730101;
            transform: scaleX(0);
            transition: transform 0.55s cubic-bezier(0.2, 0.7, 0.2, 1);
        }

        .cc-btn {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 60%;
            min-width: 140px;
            min-height: 50px;
            border: 1px solid #111;
            background: #fff;
            color: #111;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: color 0.4s ease, letter-spacing 0.5s ease;
        }

        .cc-btn::before {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: -1;
            background: #111;
            transform: scaleY(0);
            transform-origin: bottom;
            transition: transform 0.45s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .cc-btn::after {
            content: "\2192";
            position: absolute;
            right: 16px;
            opacity: 0;
            transform: translateX(-10px);
            transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.2, 0.7, 0.2, 1);
        }

        .cc-card:active .cc-media {
            transform: scale(0.985);
        }

        .cc-card:focus-visible {
            outline: 2px solid #730101;
            outline-offset: 4px;
        }

        @media (hover: hover) {
            .cc-card:hover .cc-media {
                box-shadow: 0 22px 34px -22px rgba(0, 0, 0, 0.45);
            }

            .cc-card:hover .cc-media img {
                transform: scale(1.07);
            }

            .cc-card:hover .cc-media::after {
                opacity: 1;
                transform: scale(1);
            }

            .cc-card:hover .cc-title::after {
                transform: scaleX(1);
            }

            .cc-card:hover .cc-btn {
                color: #fff;
                letter-spacing: 0.11em;
            }

            .cc-card:hover .cc-btn::before {
                transform: scaleY(1);
            }

            .cc-card:hover .cc-btn::after {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .cc-js .cc-card:not(.is-in) .cc-media,
        .cc-js .cc-card:not(.is-in) .cc-title,
        .cc-js .cc-card:not(.is-in) .cc-btn {
            visibility: hidden;
        }

        .cc-card.is-in {
            animation: ccCard 0.9s ease backwards;
            animation-delay: calc(var(--i, 0) * 260ms);
        }

        .cc-card.is-in .cc-media {
            animation: ccMedia 1.2s cubic-bezier(0.65, 0, 0.35, 1) backwards;
            animation-delay: calc(var(--i, 0) * 260ms);
        }

        .cc-card.is-in .cc-media img {
            animation: ccImg 1.8s cubic-bezier(0.2, 0.7, 0.2, 1) backwards;
            animation-delay: calc(var(--i, 0) * 260ms);
        }

        .cc-card.is-in .cc-title {
            animation: ccUp 0.8s ease backwards;
            animation-delay: calc(var(--i, 0) * 260ms + 550ms);
        }

        .cc-card.is-in .cc-btn {
            animation: ccUp 0.8s ease backwards;
            animation-delay: calc(var(--i, 0) * 260ms + 700ms);
        }

        @keyframes ccCard {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes ccMedia {
            from { clip-path: inset(0 0 100% 0); }
            to { clip-path: inset(0 0 0 0); }
        }

        @keyframes ccImg {
            from { transform: scale(1.2); }
            to { transform: scale(1); }
        }

        @keyframes ccUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .cc-card .cc-media,
            .cc-card .cc-media img,
            .cc-card .cc-title,
            .cc-card .cc-btn {
                animation: none;
                transition: none;
            }
        }

        @media (max-width: 701px) {
            .cc {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 28px 14px;
                padding: 16px 14px;
            }

            .cc-card {
                gap: 14px;
            }

            .cc-title {
                font-size: 15px;
            }

            .cc-btn {
                width: 100%;
                min-width: 0;
                min-height: 44px;
                font-size: 11px;
            }

            .cc-media::after {
                top: 10px;
                right: 10px;
                bottom: 10px;
                left: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="cc">
        <a class="cc-card" href="https://www.perfumeriasrouge.com/tratamientos/aceites-y-serum/clarins?initialMap=c,c&amp;initialQuery=tratamientos/aceites-y-serum&amp;map=category-1,category-2,brand&amp;order=OrderByReleaseDateDESC" target="_top">

            <span class="cc-media"><img src="https://rougeb2car.vtexassets.com/assets/vtex.file-manager-graphql/images/7163162c-9e04-49a1-8d9d-2edb6e91ef2b___6c765fcb881abac62d01ab44c836b36a.png" alt="Clarins Maquillaje"></span>

            <span class="cc-media"><img src="https://rougeb2car.vtexassets.com/assets/vtex.file-manager-graphql/images/4ddfe142-43a6-4d85-a0f8-5766fe111ead___430663e655f43cdd8ce93a47f1a5c1e9.png" alt="Clarins Cuerpo"></span>

            <span class="cc-media"><img src="https://rougeb2car.vtexassets.com/assets/vtex.file-manager-graphql/images/fe2737c9-4d2b-410b-a9b9-5b4dbd836131___543a9cfbaca0eec8f455b3d352a3154c.png" alt="Clarins Solares"></span>

        </a>
    </div>

    <script>
        (function () {
            var tarjetas = document.querySelectorAll(".cc-card");
            var reducido = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            if (!("IntersectionObserver" in window) || reducido) {
                for (var k = 0; k !== tarjetas.length; k++) tarjetas[k].classList.add("is-in");
                return;
            }
            document.documentElement.className += " cc-js";
            var observador = new IntersectionObserver(function (entradas) {
                var visibles = entradas.filter(function (e) { return e.isIntersecting; });
                visibles.sort(function (a, b) {
                    return a.target.getAttribute("data-n") - b.target.getAttribute("data-n");
                });
                visibles.forEach(function (e, n) {
                    e.target.style.setProperty("--i", n);
                    e.target.classList.add("is-in");
                    observador.unobserve(e.target);
                });
            }, { threshold: 0.35 });
            for (var i = 0; i !== tarjetas.length; i++) {
                tarjetas[i].setAttribute("data-n", i);
                observador.observe(tarjetas[i]);
            }
        })();
    </script>
