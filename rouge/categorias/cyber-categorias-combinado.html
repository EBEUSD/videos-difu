<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @font-face {
            font-family: 'HW Pano';
            src: url('https://raw.githubusercontent.com/EBEUSD/videos-difu/main/servicios-difu/fonts/HW%20Pano%20Regular.ttf') format('truetype');
            font-weight: 400;
            font-display: swap
        }

        @font-face {
            font-family: 'Basis Grotesque';
            src: url('https://raw.githubusercontent.com/EBEUSD/videos-difu/main/servicios-difu/fonts/BasisGrotesqueArabicPro-Regular.woff2') format('woff2');
            font-weight: 400;
            font-display: swap
        }

        @font-face {
            font-family: 'Basis Grotesque';
            src: url('https://raw.githubusercontent.com/EBEUSD/videos-difu/main/servicios-difu/fonts/BasisGrotesqueArabicPro-Medium.woff2') format('woff2');
            font-weight: 500;
            font-display: swap
        }

        @font-face {
            font-family: 'Basis Grotesque';
            src: url('https://raw.githubusercontent.com/EBEUSD/videos-difu/main/servicios-difu/fonts/BasisGrotesqueArabicPro-Bold.woff2') format('woff2');
            font-weight: 600 700;
            font-display: swap
        }

        @font-face {
            font-family: 'Basis Grotesque';
            src: url('https://raw.githubusercontent.com/EBEUSD/videos-difu/main/servicios-difu/fonts/BasisGrotesqueArabicPro-Black.woff2') format('woff2');
            font-weight: 800 900;
            font-display: swap
        }
    </style>
    <style>
        html,
        body {
            margin: 0 !important;
            padding: 0 !important;
            background: transparent
        }

        /* Separacion con el bloque anterior: padding (no margin) para que cuente en el alto del iframe */
        body {
            padding-top: 40px !important
        }

        * {
            box-sizing: border-box
        }

        #cc {
            --accent: #FF0000;
            /* Altura del estante dentro de la zona de productos */
            --floor: 272px;
            position: relative;
            width: 100%;
            height: 640px;
            background: #060606;
            color: #fff;
            font-family: 'Basis Grotesque', Arial, sans-serif;
            overflow: hidden
        }

        #cc button {
            font: inherit;
            color: inherit
        }

        /* Fondo */
        .cc-glow {
            position: absolute;
            inset: -12%;
            pointer-events: none
        }

        .cc-glow-l {
            background: radial-gradient(ellipse 34% 60% at 6% 30%, var(--accent) 0%, rgba(255, 0, 0, .45) 38%, rgba(0, 0, 0, 0) 72%);
            animation: ccGlowL 10s ease-in-out infinite alternate
        }

        .cc-glow-r {
            background: radial-gradient(ellipse 34% 60% at 94% 78%, var(--accent) 0%, rgba(255, 0, 0, .4) 38%, rgba(0, 0, 0, 0) 72%);
            animation: ccGlowR 12s ease-in-out infinite alternate
        }

        .cc-band {
            position: absolute;
            left: 0;
            right: 0;
            top: 130px;
            height: 440px;
            pointer-events: none;
            background: linear-gradient(180deg, rgba(6, 6, 6, 0) 0%, rgba(6, 6, 6, .92) 18%, #060606 40%, #060606 76%, rgba(6, 6, 6, .9) 88%, rgba(6, 6, 6, 0) 100%)
        }

        .cc-flutes {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(90deg, rgba(0, 0, 0, .34) 0 3px, rgba(255, 255, 255, .06) 3px 5px, rgba(0, 0, 0, 0) 5px 16px)
        }

        /* --tint es un color registrado para poder animarlo: la luz sigue a la imagen que se ve */
        @property --tint {
            syntax: "<color>";
            inherits: true;
            initial-value: rgba(0, 0, 0, 0)
        }

        .cc-tint,
        .cc-cell {
            --tint: var(--tint1)
        }

        .cc-tint {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.1s ease
        }

        .cc-tint.on {
            opacity: .55
        }

        .cc-follow {
            position: absolute;
            left: 0;
            top: 0;
            width: 760px;
            height: 760px;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            background: radial-gradient(circle, rgba(255, 240, 230, .07) 0%, rgba(0, 0, 0, 0) 60%);
            transition: transform .3s ease-out, opacity .5s
        }

        /* Marquesinas */
        .cc-ghostwrap {
            position: absolute;
            left: 0;
            top: 4px;
            width: 100%;
            overflow: hidden;
            pointer-events: none
        }

        .cc-track {
            display: flex;
            width: max-content;
            animation: ccMarquee 70s linear infinite
        }

        .cc-ghost {
            display: flex;
            gap: 80px;
            padding-right: 80px;
            font-family: 'HW Pano', sans-serif;
            font-weight: 400;
            font-size: 80px;
            line-height: 1;
            white-space: nowrap;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 255, .2)
        }

        .cc-ribbon {
            position: absolute;
            left: -80px;
            width: calc(100% + 160px);
            overflow: hidden;
            display: flex;
            align-items: center;
            color: #000;
            background: var(--accent);
            box-shadow: 0 10px 28px rgba(0, 0, 0, .55);
            pointer-events: none
        }

        .cc-ribbon-a {
            bottom: 6px;
            height: 26px;
            transform: rotate(1.4deg);
            filter: brightness(.6)
        }

        .cc-ribbon-b {
            bottom: 22px;
            height: 30px;
            transform: rotate(-1.6deg)
        }

        .cc-rtrack {
            display: flex;
            width: max-content
        }

        .cc-ribbon-a .cc-rtrack {
            animation: ccMarquee 160s linear infinite reverse
        }

        .cc-ribbon-b .cc-rtrack {
            animation: ccMarquee 130s linear infinite
        }

        .cc-rgroup {
            display: flex;
            gap: 28px;
            padding-right: 28px;
            font-family: 'HW Pano', sans-serif;
            font-weight: 400;
            font-size: 10px;
            letter-spacing: 3px;
            white-space: nowrap
        }

        .cc-ribbon-b .cc-rgroup {
            font-size: 11px
        }

        /* Contenido */
        .cc-inner {
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 80px 74px
        }

        .cc-w {
            width: 100%;
            max-width: 1280px
        }

        .cc-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, .25);
            padding-bottom: 14px
        }

        .cc-logo {
            font-family: 'HW Pano', sans-serif;
            font-weight: 400;
            font-size: 18px;
            letter-spacing: 9px
        }

        .cc-tag {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 3px
        }

        .cc-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--accent);
            display: inline-block;
            animation: ccPulse 1.2s ease-in-out infinite
        }

        .cc-cd {
            display: flex;
            align-items: baseline;
            gap: 8px;
            padding-left: 14px;
            border-left: 1px solid rgba(255, 255, 255, .25)
        }

        .cc-cd-lbl {
            margin-right: 2px;
            color: #BDB8AC
        }

        .cc-cd-u {
            font-size: 10px;
            letter-spacing: 1px;
            color: #BDB8AC
        }

        .cc-cd-u b {
            display: inline-block;
            min-width: 1.4em;
            margin-right: 2px;
            font-family: 'HW Pano', sans-serif;
            font-weight: 400;
            font-size: 18px;
            letter-spacing: 0;
            text-align: right;
            color: #fff
        }

        .cc-title {
            position: relative;
            z-index: 5;
            margin: 16px 0 0 !important;
            font-family: 'HW Pano', sans-serif;
            font-weight: 400;
            font-size: 26px;
            letter-spacing: 2px;
            line-height: 1.2;
            text-align: center
        }

        .cc-dots {
            display: none
        }

        /* Estante */
        .cc-shelf {
            position: relative;
            flex: 1;
            min-height: 0;
            margin-top: 18px;
            display: flex;
            gap: 10px
        }

        .cc-line {
            position: absolute;
            left: 0;
            right: 0;
            top: var(--floor);
            height: 2px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, .22) 15%, rgba(255, 255, 255, .22) 85%, rgba(255, 255, 255, 0));
            box-shadow: 0 10px 24px rgba(0, 0, 0, .6);
            pointer-events: none
        }

        /* Reflector: se desliza hasta el producto de la card activa */
        .cc-beam {
            position: absolute;
            left: 0;
            top: -70px;
            width: 0;
            height: calc(var(--floor) + 70px);
            z-index: 2;
            pointer-events: none;
            mix-blend-mode: screen;
            transition: transform .7s cubic-bezier(.7, 0, .2, 1)
        }

        .cc-beam-sway {
            position: absolute;
            left: -150px;
            top: 0;
            width: 300px;
            height: 100%;
            transform-origin: 50% 0;
            opacity: .6;
            transition: opacity .6s ease;
            animation: ccSway 7s ease-in-out infinite alternate
        }

        .cc-beam.hot .cc-beam-sway {
            opacity: 1
        }

        .cc-beam-cone {
            position: absolute;
            inset: 0;
            filter: blur(10px)
        }

        .cc-beam-cone::before {
            content: "";
            position: absolute;
            inset: 0;
            clip-path: polygon(44% 0, 56% 0, 96% 100%, 4% 100%);
            background: linear-gradient(180deg, rgba(255, 246, 238, .36) 0%, rgba(255, 240, 228, .16) 45%, rgba(255, 236, 222, .05) 85%, rgba(255, 236, 222, 0) 100%);
            -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 30%, #000 70%, transparent 100%);
            mask-image: linear-gradient(90deg, transparent 0, #000 30%, #000 70%, transparent 100%)
        }

        .cc-beam-core {
            position: absolute;
            inset: 0;
            filter: blur(18px);
            animation: ccBreath 4.5s ease-in-out infinite
        }

        .cc-beam-core::before {
            content: "";
            position: absolute;
            inset: 0;
            clip-path: polygon(47% 0, 53% 0, 72% 100%, 28% 100%);
            background: linear-gradient(180deg, rgba(255, 250, 244, .35), rgba(255, 244, 234, .06) 90%)
        }

        .cc-beam-src {
            position: absolute;
            left: 50%;
            top: -14px;
            width: 70px;
            height: 28px;
            margin-left: -35px;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(255, 250, 245, .9) 0%, rgba(255, 240, 228, .25) 45%, rgba(255, 240, 228, 0) 75%);
            filter: blur(3px)
        }

        .cc-beam-pool {
            position: absolute;
            left: 50%;
            top: calc(100% - 23px);
            width: 250px;
            height: 46px;
            margin-left: -125px;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(255, 244, 234, .30) 0%, rgba(255, 236, 222, .10) 45%, rgba(255, 236, 222, 0) 72%);
            filter: blur(4px);
            animation: ccBreath 4.5s ease-in-out infinite
        }

        /* Celda: producto en el estante; la activa se despliega como card */
        .cc-cell {
            position: relative;
            z-index: 1;
            flex: 1 1 0;
            min-width: 0;
            height: 100%;
            padding: 0;
            margin: 0;
            border: 0;
            background: transparent;
            text-align: left;
            cursor: pointer;
            /* La tipografia de la card escala con su ancho (cqi) */
            container-type: inline-size;
            /* Mantener en sincronia con GROW del script (posicion del reflector) */
            transition: flex-grow .7s cubic-bezier(.7, 0, .2, 1)
        }

        .cc-cell.on {
            flex-grow: 4.2
        }

        .cc-cell:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 4px
        }

        .cc-card {
            position: absolute;
            inset: 0;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, .3);
            background: radial-gradient(ellipse 90% 60% at 75% 100%, var(--tint) 0%, rgba(6, 6, 6, 0) 70%), linear-gradient(180deg, #151515, #0a0a0a);
            opacity: 0;
            transform: scale(.97);
            transition: opacity .45s, transform .6s cubic-bezier(.2, .8, .2, 1)
        }

        .cc-cell.on .cc-card {
            opacity: 1;
            transform: none
        }

        /* El estante continua dentro de la card */
        .cc-card::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: var(--floor);
            height: 1px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, .18) 40%, rgba(255, 255, 255, .18) 90%, rgba(255, 255, 255, 0))
        }

        .cc-ring {
            position: absolute;
            left: calc(77% - 9px);
            top: calc(var(--floor) - 110px);
            width: 46cqi;
            aspect-ratio: 1;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, .12);
            background: radial-gradient(circle, var(--tint) 0%, rgba(6, 6, 6, 0) 66%);
            opacity: 0;
            transform: translate(-50%, -50%) scale(.85);
            transition: opacity .6s, transform .8s cubic-bezier(.2, .8, .2, 1)
        }

        .cc-cell.on .cc-ring {
            opacity: 1;
            transform: translate(-50%, -50%);
            transition-delay: .25s
        }

        .cc-bar {
            position: absolute;
            left: 0;
            top: 0;
            right: 0;
            height: 2px
        }

        .cc-prog {
            display: block;
            height: 2px;
            width: 0;
            background: var(--accent);
            animation: ccProg 3s linear both
        }

        /* Producto: misma base (el estante) en los dos estados */
        .cc-img {
            position: absolute;
            left: 6px;
            top: calc(var(--floor) - 186px);
            width: calc(100% - 12px);
            height: 180px;
            max-width: none;
            object-fit: contain;
            object-position: 50% 100%;
            /* Las fotos traen aire transparente alrededor: se escalan desde la base */
            transform-origin: 50% 100%;
            transform: scale(1.5);
            opacity: .7;
            pointer-events: none;
            filter: saturate(.85) drop-shadow(0 12px 14px rgba(0, 0, 0, .55));
            transition: left .7s cubic-bezier(.7, 0, .2, 1), top .7s cubic-bezier(.7, 0, .2, 1), width .7s cubic-bezier(.7, 0, .2, 1), height .7s cubic-bezier(.7, 0, .2, 1), transform .7s cubic-bezier(.7, 0, .2, 1), opacity .5s, filter .5s
        }

        .cc-cell:hover .cc-img {
            opacity: 1
        }

        /* Segunda imagen (imgOn): reemplaza a la primera cuando la card se agranda */
        .cc-cell.cc-two .cc-img.cc-img2 {
            opacity: 0
        }

        .cc-cell.cc-two.on .cc-img.cc-img2 {
            opacity: 1
        }

        .cc-cell.cc-two.on .cc-img:not(.cc-img2) {
            opacity: 0
        }

        /* Abierta, las cards con dos imagenes giran y alternan cada 2s */
        .cc-cell.cc-two.on .cc-img.cc-img2 {
            animation: ccFlipA 4s linear infinite
        }

        .cc-cell.cc-two.on .cc-img:not(.cc-img2) {
            animation: ccFlipB 4s linear infinite
        }

        /* Luz: arranca con el color de la imagen 2 y cambia junto con el giro */
        .cc-cell.cc-two.on,
        .cc-tint.cc-two.on {
            animation: ccTint 4s linear infinite
        }

        @keyframes ccTint {
            0%, 44% { --tint: var(--tint2) }
            56%, 94% { --tint: var(--tint1) }
            100% { --tint: var(--tint2) }
        }

        @keyframes ccFlipA {
            0% { rotate: y -90deg; opacity: 1 }
            8%, 42% { rotate: y 0deg; opacity: 1 }
            50% { rotate: y 90deg; opacity: 1 }
            50.01%, 100% { rotate: y 90deg; opacity: 0 }
        }

        @keyframes ccFlipB {
            0%, 49.99% { rotate: y -90deg; opacity: 0 }
            50% { rotate: y -90deg; opacity: 1 }
            58%, 92% { rotate: y 0deg; opacity: 1 }
            100% { rotate: y 90deg; opacity: 1 }
        }

        /* Sale y Sets: las fotos vienen recortadas al ras, se escalan menos que el resto */
        .cc-cell.cc-sale .cc-img,
        .cc-cell.cc-masc .cc-img,
        .cc-cell.cc-sets .cc-img {
            transform: scale(.95)
        }

        .cc-cell.cc-sets.on .cc-img {
            transform: scale(.95)
        }

        .cc-cell.cc-sale .cc-img,
        .cc-cell.cc-masc .cc-img {
            transform: scale(.85)
        }

        /* Maquillaje: la imagen 1 (paleta D&G) es ancha y trae aire abajo (~23% del alto):
           se baja hasta el estante; cqi = ancho de la celda, asi acompana el alto real de la foto */
        .cc-cell.cc-maq .cc-img:not(.cc-img2) {
            transform: scale(.95);
            translate: 0 38cqi
        }

        .cc-cell.cc-maq.on .cc-img:not(.cc-img2) {
            transform: scale(1.1);
            translate: 0 calc(15.5cqi - 6px)
        }

        /* La paleta (imagen 2) tiene aire abajo: se sube para centrarla en el aro */
        .cc-cell.cc-maq.on .cc-img.cc-img2 {
            translate: 0 -38px
        }

        /* Sets: el Devotion (imagen 1) abierto queda grande */
        .cc-cell.cc-sets.on .cc-img:not(.cc-img2) {
            transform: scale(.75)
        }

        /* Lanzamientos: el Devotion (imagen 1) es un frasco alto al ras, igual que en Sets */
        .cc-cell.cc-new .cc-img:not(.cc-img2) {
            transform: scale(.95)
        }

        .cc-cell.cc-new.on .cc-img:not(.cc-img2) {
            transform: scale(.75)
        }

        /* Lanzamientos: el Good Girl (hover) viene al ras */
        .cc-cell.cc-new.on .cc-img.cc-img2 {
            transform: scale(.88)
        }

        /* K-beauty: el aceite Centella (hover) viene al ras */
        .cc-cell.cc-kb.on .cc-img.cc-img2 {
            transform: scale(.85)
        }

        /* Femeninas: la mariposa (hover) viene al ras */
        .cc-cell.cc-fem.on .cc-img.cc-img2 {
            transform: scale(.78)
        }

        /* Capilares: el set Kerastase (hover) viene al ras */
        .cc-cell.cc-cap.on .cc-img.cc-img2 {
            transform: scale(1.05)
        }

        /* Tratamiento: neceseres anchos recortados al ras */
        .cc-cell.cc-trat .cc-img {
            transform: scale(.95)
        }

        .cc-cell.cc-trat.on .cc-img {
            transform: scale(1.1)
        }

        /* Menos de $100K: las dos imagenes (par de frascos) traen aire a los costados */
        .cc-cell.cc-m100 .cc-img {
            transform: scale(1.7)
        }

        .cc-cell.cc-m100.on .cc-img {
            transform: scale(1.6)
        }

        .cc-cell.cc-sale.on .cc-img,
        .cc-cell.cc-masc.on .cc-img {
            transform: scale(.8)
        }

        .cc-cell.on .cc-img {
            left: 54%;
            top: calc(var(--floor) - 236px);
            width: calc(46% - 18px);
            height: 230px;
            transform: scale(1.3);
            opacity: 1;
            filter: drop-shadow(0 20px 26px rgba(0, 0, 0, .6))
        }

        /* Vista cerrada: nombre + chip debajo del estante */
        .cc-meta {
            position: absolute;
            left: 4px;
            right: 4px;
            top: calc(var(--floor) + 16px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transition: opacity .3s
        }

        .cc-cell.on .cc-meta {
            opacity: 0
        }

        /* Alto fijo de 2 lineas para que los chips queden alineados */
        .cc-label {
            min-height: 2.5em;
            font-weight: 500;
            font-size: clamp(12px, 13.5cqi, 16px);
            line-height: 1.25;
            text-align: center;
            text-wrap: balance;
            color: #BDB8AC;
            transition: color .3s
        }

        .cc-cell:hover .cc-label {
            color: #fff
        }

        .cc-chip {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 5px 6px 6px;
            line-height: 1;
            white-space: nowrap;
            background: var(--accent);
            box-shadow: 0 6px 18px rgba(255, 0, 0, .35)
        }

        .cc-chip small {
            margin-bottom: 3px;
            /* Se achica en celdas angostas para no cortar "LO ÚLTIMO" / "MENOS DE" */
            font-size: clamp(7px, 10cqi, 8px);
            font-weight: 700;
            letter-spacing: clamp(.5px, 2cqi, 2px);
            color: #000
        }

        .cc-chip b {
            font-weight: 900;
            font-size: clamp(15px, 17cqi, 22px);
            letter-spacing: -.02em;
            color: #fff
        }

        /* Precio abierto con texto largo ($100 MIL, NEW IN): mas chico para igualar al resto */
        .cc-m100 .cc-pct,
        .cc-new .cc-pct {
            font-size: clamp(40px, 12cqi, 66px)
        }

        .cc-m100 .cc-price,
        .cc-new .cc-price {
            padding: 12px 14px 12px 10px
        }

        /* "MENOS DE" / "LO ULTIMO" en vertical son mas largos que "HASTA": se compactan */
        .cc-cell.cc-m100 .cc-hasta,
        .cc-cell.cc-new .cc-hasta {
            font-size: 8px;
            letter-spacing: 1px
        }

        /* Estado cerrado mas grande: factor extra (scale) sobre el transform de cada producto */
        .cc-img {
            scale: 1.3;
            transition: left .7s cubic-bezier(.7, 0, .2, 1), top .7s cubic-bezier(.7, 0, .2, 1), width .7s cubic-bezier(.7, 0, .2, 1), height .7s cubic-bezier(.7, 0, .2, 1), transform .7s cubic-bezier(.7, 0, .2, 1), scale .7s cubic-bezier(.7, 0, .2, 1), opacity .5s, filter .5s
        }

        .cc-cell.on .cc-img {
            scale: 1
        }

        .cc-meta {
            scale: 1.15;
            transform-origin: 50% 0
        }

        /* En pantallas medianas las celdas son angostas: textos sin agrandar para que no se toquen */
        @media (max-width:1200px) {
            .cc-meta {
                scale: 1.04
            }
        }

        /* Vista abierta: cabecera arriba, precio + CTA abajo */
        .cc-info {
            position: absolute;
            left: 26px;
            top: 26px;
            bottom: 24px;
            width: 50%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            opacity: 0;
            pointer-events: none
        }

        .cc-cell.on .cc-info {
            animation: ccIn .6s .35s cubic-bezier(.2, .8, .2, 1) both
        }

        .cc-head,
        .cc-foot {
            display: flex;
            flex-direction: column;
            align-items: flex-start
        }

        .cc-head {
            gap: 12px
        }

        .cc-foot {
            gap: 16px
        }

        .cc-head::before {
            content: "";
            width: 36px;
            height: 2px;
            margin-bottom: 4px;
            background: var(--accent)
        }

        .cc-name {
            font-family: 'HW Pano', sans-serif;
            font-size: clamp(16px, 4.4cqi, 24px);
            letter-spacing: 1px;
            line-height: 1.15;
            text-transform: uppercase
        }

        .cc-desc {
            max-width: 24ch;
            font-size: 14px;
            line-height: 1.45;
            color: #E6E2D9
        }

        .cc-price {
            display: flex;
            align-items: stretch;
            gap: 8px;
            padding: 14px 16px 14px 12px;
            line-height: 1;
            background: var(--accent);
            box-shadow: 0 16px 40px rgba(255, 0, 0, .35)
        }

        .cc-hasta {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            text-align: center;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #000
        }

        .cc-pct {
            font-weight: 900;
            font-size: clamp(56px, 18cqi, 100px);
            line-height: .75;
            letter-spacing: -.04em;
            color: #fff
        }

        .cc-pside {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-start
        }

        .cc-psign {
            font-weight: 900;
            font-size: clamp(26px, 7.5cqi, 44px);
            line-height: .75;
            color: #fff
        }

        .cc-offtag {
            padding: 4px 8px;
            background: #000;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px
        }

        .cc-go {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-height: 44px;
            padding: 0 20px;
            background: #fff;
            color: #000;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 3px;
            transition: background .2s
        }

        .cc-go svg {
            transition: transform .25s
        }

        .cc-cell.on:hover .cc-go {
            background: #D6D2C4
        }

        .cc-cell.on:hover .cc-go svg {
            transform: translateX(4px)
        }

        @keyframes ccIn {
            from {
                opacity: 0;
                transform: translateY(14px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        @keyframes ccProg {
            from {
                width: 0
            }

            to {
                width: 100%
            }
        }

        @keyframes ccSway {
            from {
                transform: rotate(-1.2deg)
            }

            to {
                transform: rotate(1.2deg)
            }
        }

        @keyframes ccBreath {

            0%,
            100% {
                opacity: .85
            }

            50% {
                opacity: 1
            }
        }

        @keyframes ccGlowL {
            from {
                transform: translate(-4%, 0) scale(1)
            }

            to {
                transform: translate(6%, -4%) scale(1.12)
            }
        }

        @keyframes ccGlowR {
            from {
                transform: translate(4%, 0) scale(1.08)
            }

            to {
                transform: translate(-6%, 5%) scale(.95)
            }
        }

        @keyframes ccMarquee {
            from {
                transform: translateX(0)
            }

            to {
                transform: translateX(-50%)
            }
        }

        @keyframes ccPulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1)
            }

            50% {
                opacity: .35;
                transform: scale(.7)
            }
        }

        /* Tablet */
        @media (max-width:1100px) {
            .cc-inner {
                padding: 20px 24px 74px
            }

            .cc-ghost {
                font-size: 64px
            }

            .cc-info {
                left: 22px
            }

            .cc-desc {
                font-size: 13px
            }
        }

        /* Mobile: carrusel horizontal con swipe, todas las cards desplegadas */
        @media (max-width:768px) {
            #cc {
                height: auto
            }

            .cc-inner {
                height: auto;
                align-items: stretch;
                padding: 22px 0 78px
            }

            .cc-top {
                width: auto;
                margin: 0 16px
            }

            .cc-logo {
                font-size: 14px;
                letter-spacing: 6px
            }

            .cc-tag {
                font-size: 10px;
                letter-spacing: 2px;
                gap: 8px
            }

            #cc-date,
            .cc-cd-lbl {
                display: none
            }

            .cc-cd {
                gap: 5px;
                padding-left: 0;
                border-left: 0
            }

            .cc-cd-u {
                font-size: 9px;
                white-space: nowrap
            }

            .cc-cd-u b {
                font-size: 14px
            }

            .cc-title {
                margin: 20px 16px 14px !important;
                font-size: 24px;
                line-height: 1.15;
                text-align: left
            }

            .cc-ghost {
                font-size: 48px
            }

            .cc-band,
            .cc-beam,
            .cc-line,
            .cc-follow,
            .cc-card::after {
                display: none
            }

            .cc-shelf {
                flex: none;
                width: auto;
                max-width: none;
                margin: 0;
                gap: 10px;
                padding: 0 16px 4px;
                overflow-x: auto;
                scroll-snap-type: x mandatory;
                scroll-padding-left: 16px;
                scrollbar-width: none
            }

            .cc-shelf::-webkit-scrollbar {
                display: none
            }

            .cc-cell,
            .cc-cell.on {
                flex: 0 0 78%;
                height: 380px;
                scroll-snap-align: start
            }

            .cc-card,
            .cc-cell.on .cc-card {
                opacity: 1;
                transform: none;
                border-color: rgba(255, 255, 255, .18);
                background: radial-gradient(ellipse 90% 60% at 50% 100%, var(--tint) 0%, rgba(6, 6, 6, 0) 70%), linear-gradient(180deg, #151515, #0a0a0a)
            }

            .cc-ring,
            .cc-cell.on .cc-ring {
                left: 50%;
                top: 36%;
                width: 74cqi;
                opacity: 1;
                transform: translate(-50%, -50%)
            }

            .cc-img,
            .cc-cell:hover .cc-img,
            .cc-cell.on .cc-img {
                left: 14%;
                top: 30px;
                width: 72%;
                height: 52%;
                transform: scale(1.45);
                opacity: 1;
                filter: drop-shadow(0 16px 20px rgba(0, 0, 0, .6));
                transition: none
            }

            /* Ajustes individuales por producto (mobile): las fotos traen distinto aire,
               se agrandan y suben las que quedaban chicas o abajo del aro */
            .cc-maq .cc-img,
            .cc-maq.on .cc-img {
                top: 0;
                transform: scale(2)
            }

            .cc-kb .cc-img,
            .cc-kb.on .cc-img {
                top: 18px;
                transform: scale(1.65)
            }

            .cc-cell.cc-sets .cc-img,
            .cc-cell.cc-sets.on .cc-img {
                top: 24px;
                transform: scale(.95)
            }

            .cc-cell.cc-sale .cc-img,
            .cc-cell.cc-sale.on .cc-img,
            .cc-cell.cc-masc .cc-img,
            .cc-cell.cc-masc.on .cc-img {
                top: 30px;
                transform: scale(.8)
            }

            .cc-cell.cc-m100 .cc-img,
            .cc-cell.cc-m100.on .cc-img {
                top: 30px;
                transform: scale(1.25)
            }

            .cc-cell.cc-trat .cc-img,
            .cc-cell.cc-trat.on .cc-img {
                top: 22px;
                transform: scale(.95)
            }

            .cc-cell.cc-maq .cc-img.cc-img2,
            .cc-cell.cc-maq.on .cc-img.cc-img2 {
                translate: 0 22px
            }

            .cc-cell.cc-maq .cc-img:not(.cc-img2),
            .cc-cell.cc-maq.on .cc-img:not(.cc-img2) {
                top: 26px;
                transform: scale(1.1);
                translate: 0 40px
            }

            .cc-cell.cc-sets .cc-img:not(.cc-img2),
            .cc-cell.cc-sets.on .cc-img:not(.cc-img2) {
                top: 30px;
                transform: scale(.78)
            }

            .cc-cell.cc-new .cc-img:not(.cc-img2),
            .cc-cell.cc-new.on .cc-img:not(.cc-img2) {
                top: 30px;
                transform: scale(.78)
            }

            .cc-cell.cc-new .cc-img.cc-img2 {
                top: 24px;
                transform: scale(.76)
            }

            .cc-cell.cc-kb .cc-img.cc-img2 {
                top: 26px;
                transform: scale(.85)
            }

            .cc-cell.cc-fem .cc-img.cc-img2 {
                top: 26px;
                transform: scale(.8)
            }

            .cc-cell.cc-cap .cc-img.cc-img2 {
                top: 26px;
                transform: scale(1.1)
            }

            /* En mobile todas las cards se ven abiertas: las de dos imagenes giran siempre */
            .cc-cell.cc-two {
                animation: ccTint 4s linear infinite
            }

            .cc-cell.cc-two .cc-img.cc-img2 {
                animation: ccFlipA 4s linear infinite
            }

            .cc-cell.cc-two .cc-img:not(.cc-img2) {
                animation: ccFlipB 4s linear infinite
            }

            /* Sin animacion (reduce motion): va la imagen agrandada */
            .cc-cell.cc-two .cc-img.cc-img2 {
                opacity: 1
            }

            .cc-cell.cc-two .cc-img:not(.cc-img2) {
                opacity: 0
            }

            .cc-sets .cc-name,
            .cc-m100 .cc-name {
                font-size: 14px
            }

            .cc-m100 .cc-pct,
            .cc-new .cc-pct {
                font-size: 50px
            }

            /* Chip arriba a la izquierda; el nombre va en la info */
            .cc-meta,
            .cc-cell.on .cc-meta {
                top: 12px;
                left: 12px;
                right: auto;
                opacity: 1
            }

            .cc-label {
                display: none
            }

            .cc-img,
            .cc-meta {
                scale: 1
            }

            .cc-chip b {
                font-size: 16px
            }

            .cc-info,
            .cc-cell.on .cc-info {
                top: auto;
                left: 14px;
                right: 14px;
                bottom: 16px;
                width: auto;
                justify-content: flex-end;
                gap: 10px;
                opacity: 1;
                animation: none
            }

            .cc-head::before,
            .cc-desc,
            .cc-go {
                display: none
            }

            .cc-name {
                font-size: 17px;
                line-height: 1.1
            }

            .cc-price {
                gap: 7px;
                padding: 10px 14px 10px 10px;
                box-shadow: 0 12px 30px rgba(255, 0, 0, .4)
            }

            .cc-hasta {
                font-size: 10px;
                letter-spacing: 2px
            }

            .cc-pct {
                font-size: 72px
            }

            .cc-psign {
                font-size: 32px
            }

            .cc-offtag {
                padding: 3px 6px;
                font-size: 11px;
                letter-spacing: 1.5px
            }

            .cc-dots {
                display: flex;
                justify-content: center;
                gap: 6px;
                margin-top: 16px
            }

            .cc-dots span {
                width: 10px;
                height: 2px;
                background: rgba(255, 255, 255, .3);
                transition: width .3s, background .3s
            }

            .cc-dots span.on {
                width: 26px;
                background: #fff
            }

            .cc-ribbon-a {
                transform: rotate(3deg)
            }

            .cc-ribbon-b {
                transform: rotate(-3deg)
            }
        }

        @media (prefers-reduced-motion:reduce) {

            .cc-cell,
            .cc-card,
            .cc-ring,
            .cc-img,
            .cc-meta,
            .cc-beam,
            .cc-tint,
            .cc-follow {
                transition: none
            }

            .cc-cell.on .cc-info {
                animation: none;
                opacity: 1
            }

            .cc-cell.cc-two .cc-img,
            .cc-cell.cc-two.on .cc-img,
            .cc-cell.cc-two,
            .cc-tint.cc-two {
                animation: none !important
            }

            .cc-beam-sway,
            .cc-beam-core,
            .cc-beam-pool,
            .cc-prog,
            .cc-glow,
            .cc-track,
            .cc-rtrack,
            .cc-dot {
                animation: none
            }
        }
    </style>
</head>
